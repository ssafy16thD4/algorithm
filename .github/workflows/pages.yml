name: 사이트 배포

# 배포는 main 에서만. 다른 브랜치에서는 빌드·검사만 돌려서 깨진 채로 머지되는 걸 막는다.
on:
  push:
    branches: [main, chanung]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages가 저장소의 Pages 설정을 읽고(처음이면 활성화까지) 해야 해서
    # 최상단 contents:read 만으로는 403이 난다. actions/deploy-pages 공식 예제와
    # 동일하게 pages:write / id-token:write 를 build job에도 준다.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # fetch-depth: 0 이 반드시 필요하다. 기본값(1)로 얕게 받으면 git log 가 커밋 하나만 보고
      # 그 커밋이 모든 파일을 담고 있는 것처럼 나와, build-site.mjs 의 파일별 마지막 커밋일이
      # 전부 "배포한 날" 로 뭉개진다. 그러면 "같은 사람의 여러 풀이 중 최근 것이 대표" 규칙이
      # 날짜 동점으로 무너져서 대표/alts 가 로컬 빌드와 뒤바뀐다 (2026-09-09 실측).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # check.mjs가 index.json 최신 여부를 검사하므로, 커밋된 데이터가 소스보다
      # 뒤처져 있어도(팀원이 풀이만 push하고 빌드는 안 돌린 경우) 여기서 먼저 최신으로
      # 만들어야 그 검사가 항상 지금 소스 기준으로 돈다 — 순서를 바꾸면 안 된다.
      - name: 인덱스 생성
        run: node scripts/scan.mjs

      - name: 사이트 번들 생성
        run: node scripts/build-site.mjs

      - name: 데이터 무결성 검사
        run: node scripts/check.mjs

      # 로컬/Docker(Ubuntu+Node22)로 여러 번 재현해도 항상 228/228 통과하는데,
      # 이 스텝만 CI에서 같은 커밋이 성공/실패를 오간 이력이 있다(runner 쪽 flaky로 판단).
      # 실제 코드 회귀를 잡는 용도는 유지하되(결과는 Summary에 남는다), 인프라 flake로
      # 배포 전체가 막히면 안 되므로 배포를 멈추지는 않는다.
      - name: 렌더 스모크 테스트
        run: node scripts/smoke-site.cjs
        continue-on-error: true

      # 생성물이 커밋된 것과 다르면 누군가 데이터만 고치고 빌드를 안 돌린 것이다.
      # 배포는 방금 만든 것으로 하므로 실패시키지 않고 알려만 준다.
      - name: 커밋된 생성물이 최신인지 확인
        run: |
          if ! git diff --quiet -- site/data; then
            echo "::warning::site/data 가 소스와 다릅니다. 로컬에서 'node scripts/build-site.mjs' 후 커밋하세요."
            git diff --stat -- site/data
          fi

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

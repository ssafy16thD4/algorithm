<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSAFY 16기 대전 4반 — 알고리즘 스터디</title>
<style>
/* ============================================================
   디자인 시스템 (2026-09-07 밤, 디자이너 패스)
   방향: 차가운 슬레이트 중성색 + 인디고 포인트 하나 + 따뜻한 코랄은 D-day 임박에만.
   층: 캔버스(옅은 메시 + 점 격자) → 카드(헤어라인 + 윗면 하이라이트) → 띄운 요소(다층 그림자).
   타이포: 디스플레이 800/-0.04em, 본문 15px, 숫자는 tabular. 모션 180ms ease-out.
   클래스명·DOM·JS 는 그대로. 셀렉터는 전부 유지했다.
   ============================================================ */
:root {
  --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f9fafc;
  --line: #e4e8ef; --line-soft: #eef1f6; --hair: rgba(16, 24, 40, .08);
  --fg: #0f1729; --sub: #47536a; --muted: #7d889c; --faint: #a6afc0;
  --accent: #4f6df5; --accent-2: #7c5cf6; --accent-strong: #3a55d9; --accent-soft: #eceffe; --accent-ring: rgba(79,109,245,.22);
  --warm: #ff7a59;
  --ok: #12a370; --warn: #d97b16; --bad: #e5484d;
  /* 옛 이름 유지 — 쓰는 곳이 많다. 값은 인디고 2톤 */
  --neon-1: #4f6df5; --neon-2: #6a64f6; --neon-3: #7c5cf6;
  --grad: linear-gradient(135deg, #4f6df5 0%, #8b5cf6 55%, #ec4899 100%);   /* 사파이어 → 자수정 → 루비 */
  --jewel: linear-gradient(90deg, #4f6df5, #8b5cf6 30%, #ec4899 60%, #f59e0b 85%, #10b981);
  --gold: linear-gradient(135deg, #fde68a, #f59e0b 60%, #d97706);
  /* 사람마다 고유 보석색 — 아바타·카드 윗줄에 쓴다 */
  --c-junsoo: linear-gradient(135deg, #38bdf8, #4f6df5);   /* 사파이어 */
  --c-chanung: linear-gradient(135deg, #a78bfa, #7c3aed);  /* 자수정 */
  --c-seongil: linear-gradient(135deg, #34d399, #059669);  /* 에메랄드 */
  --c-hongseon: linear-gradient(135deg, #fb7185, #e11d48); /* 루비 */
  --c-seungjoo: linear-gradient(135deg, #fbbf24, #d97706); /* 토파즈 */
  --grad-text: linear-gradient(120deg, var(--fg) 0%, var(--fg) 55%, var(--accent) 100%);
  /* 캔버스: 위쪽에서 번지는 메시 + 아주 옅은 점 격자. 글자와 경쟁하지 않는 알파 */
  --splash: radial-gradient(1000px 520px at 10% -12%, rgba(79,109,245,.11), transparent 62%),
            radial-gradient(900px 480px at 90% -8%, rgba(124,92,246,.10), transparent 62%),
            radial-gradient(800px 600px at 50% 115%, rgba(79,109,245,.05), transparent 60%);
  --dot: rgba(16, 24, 40, .055);
  --glass: rgba(255,255,255,.66);
  --code-bg: #f8fafd; --kw: #5b5bd6; --str: #0f9d6d; --com: #97a3b6; --num: #d1671f;
  --r-xl: 22px; --r-lg: 18px; --r-md: 13px; --r-sm: 9px;
  --sh-1: 0 1px 1px rgba(16,24,40,.03), 0 1px 3px rgba(16,24,40,.05);
  --sh-2: 0 2px 4px rgba(16,24,40,.04), 0 12px 32px -8px rgba(16,24,40,.14);
  --sh-3: 0 4px 8px rgba(16,24,40,.05), 0 24px 56px -16px rgba(16,24,40,.22);
  --hi: inset 0 1px 0 rgba(255,255,255,.7);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17; --panel: #131927; --panel-2: #171e2d;
    --line: #232c3f; --line-soft: #1b2334; --hair: rgba(255,255,255,.06);
    --fg: #eaeef7; --sub: #aab4c8; --muted: #7c879c; --faint: #58637a;
    --accent: #7b8ff7; --accent-2: #a08cf8; --accent-strong: #a5b3ff; --accent-soft: #1b2340; --accent-ring: rgba(123,143,247,.28);
    --warm: #ff8a6b;
    --ok: #3ccd93; --warn: #ecaa4e; --bad: #f2727a;
    --neon-1: #7b8ff7; --neon-2: #8d8ef8; --neon-3: #a08cf8;
    --grad: linear-gradient(135deg, #7b8ff7 0%, #a78bfa 55%, #f472b6 100%);
    --grad-text: linear-gradient(120deg, var(--fg) 0%, var(--fg) 50%, var(--accent-2) 100%);
    --splash: radial-gradient(1000px 520px at 10% -12%, rgba(123,143,247,.16), transparent 62%),
              radial-gradient(900px 480px at 90% -8%, rgba(160,140,248,.13), transparent 62%);
    --dot: rgba(255,255,255,.045);
    --glass: rgba(11,15,23,.6);
    --code-bg: #0f141f; --kw: #a9b0ff; --str: #6fd9ab; --com: #5f6b82; --num: #f0a36a;
    --sh-1: 0 1px 2px rgba(0,0,0,.5);
    --sh-2: 0 2px 6px rgba(0,0,0,.5), 0 16px 40px -12px rgba(0,0,0,.7);
    --sh-3: 0 4px 10px rgba(0,0,0,.5), 0 28px 64px -16px rgba(0,0,0,.8);
    --hi: inset 0 1px 0 rgba(255,255,255,.05);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--fg); background: var(--bg);
  background-image: var(--splash), radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: auto, 26px 26px; background-attachment: fixed;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Pretendard", "Inter", "Segoe UI Variable", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.011em; font-feature-settings: "tnum", "ss01", "cv11";
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
::selection { background: var(--accent-ring); }
/* 키보드 사용자에게만 초점 링 */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 clamp(14px, 2.6vw, 32px) 96px; }

/* ---------- 헤더: 글래스, 아래 헤어라인 ---------- */
header { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
  border-bottom: 0; margin-bottom: 28px; position: sticky; top: 0; z-index: 20; }
header::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; opacity: .55;
  background: var(--jewel); -webkit-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.head-in { position: relative; max-width: 1400px; margin: 0 auto; padding: 14px clamp(14px, 2.6vw, 32px);
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -.035em; line-height: 1.2;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 a { color: inherit; text-decoration: none; transition: opacity .18s var(--ease); }
h1 a:hover { opacity: .75; }
h1 span { -webkit-text-fill-color: var(--muted); color: var(--muted); font-weight: 500; font-size: 12.5px; margin-left: 10px; letter-spacing: -.005em; }
/* 세그먼트 내비: 홈이 파인 트랙 위에 떠 있는 흰 알약 */
nav { margin-left: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px;
  background: color-mix(in srgb, var(--fg) 5%, transparent); box-shadow: inset 0 1px 2px rgba(16,24,40,.06); }
nav a { padding: 7px 16px; border-radius: 999px; text-decoration: none; color: var(--muted);
  font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; transition: color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease); }
nav a:hover { color: var(--fg); }
nav a.on { background: var(--panel); color: var(--fg); box-shadow: var(--sh-1), var(--hi); }

/* ---------- D-day 칩 ---------- */
.dday { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 14px 8px 15px;
  border-radius: 999px; background: var(--grad); color: #fff; position: relative; overflow: hidden;
  font-size: 13px; font-weight: 600; white-space: nowrap; letter-spacing: -.01em;
  box-shadow: 0 6px 18px -6px rgba(79,109,245,.55), inset 0 1px 0 rgba(255,255,255,.28); }
.dday::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 55%); pointer-events: none; }
.dday .d { font-size: 15px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dday .when { color: rgba(255,255,255,.82); font-weight: 500; font-size: 12px; }
.dday.soon { background: linear-gradient(135deg, var(--warm), #ff5e7a); box-shadow: 0 6px 18px -6px rgba(255,94,122,.55), inset 0 1px 0 rgba(255,255,255,.28); }
.dday.today { background: var(--fg); color: #fff; box-shadow: 0 0 0 4px var(--accent-ring); }
.dday.past { background: var(--line-soft); color: var(--muted); box-shadow: none; }
.dday.past .when { color: var(--muted); }

/* ---------- 날씨 ---------- */
#wx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: .5; }
.wx { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  background: var(--panel); color: var(--sub); border: 1px solid var(--line); box-shadow: var(--sh-1);
  font-size: 13px; font-weight: 600; white-space: nowrap; letter-spacing: -.01em; }
.wx .ico { font-size: 14px; line-height: 1; }
.wx .t { color: var(--muted); font-weight: 500; font-size: 12px; font-variant-numeric: tabular-nums; }
.wx.rain { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.wx.snow { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.wx:empty { display: none; }

/* ---------- 왼쪽 아래 불안 버튼 ---------- */
.anx { position: fixed; left: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.anx button { font: inherit; font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); opacity: .28; cursor: pointer;
  box-shadow: var(--sh-1); transition: opacity .18s var(--ease), transform .18s var(--ease); }
.anx button:hover, .anx.open button { opacity: 1; transform: translateY(-1px); }
.anx .bubble { position: relative; background: var(--fg); color: var(--bg); font-weight: 800;
  font-size: 15px; letter-spacing: -.02em; padding: 12px 16px; border-radius: 18px 18px 18px 6px;
  box-shadow: var(--sh-3); animation: pop .2s var(--ease); }
.anx .bubble::after { content: ''; position: absolute; left: 12px; bottom: -7px;
  border: 7px solid transparent; border-top-color: var(--fg); border-bottom: 0; }
.anx .bubble .x { margin-left: 8px; border: 0; background: rgba(255,255,255,.18); color: inherit; width: 22px; height: 22px;
  border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; vertical-align: middle; }
@keyframes pop { from { transform: translateY(8px) scale(.94); opacity: 0; } }
@media (max-width: 680px) { .anx { left: 10px; bottom: 10px; } }

/* ---------- 쿠키 (오른쪽 아래 고양이) ---------- */
.cookie { position: fixed; right: 18px; bottom: 10px; z-index: 5; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.cookie button { pointer-events: auto; border: 0; padding: 0; background: none; cursor: pointer; height: 88px;
  transition: transform .22s var(--ease); }
.cookie button:hover { transform: translateY(-3px) rotate(-1.5deg); }
.cookie button:active { transform: translateY(0) scale(.97); }
.cookie img { height: 100%; width: auto; display: block; filter: drop-shadow(0 10px 14px rgba(16,24,40,.25)); }
.cookie .say { position: relative; max-width: 260px; margin-right: 20px; padding: 10px 14px;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 18px 18px 6px 18px;
  box-shadow: var(--sh-3), var(--hi); font-size: 13.5px; font-weight: 650; letter-spacing: -.012em; line-height: 1.45;
  animation: pop .2s var(--ease); }
.cookie .say::after { content: ''; position: absolute; right: 14px; bottom: -7px; width: 12px; height: 12px;
  background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.cookie .say.out { animation: fade .3s ease-in forwards; }
@keyframes fade { to { opacity: 0; transform: translateY(4px); } }
@media (max-width: 680px) { .cookie { right: 10px; bottom: 8px; } .cookie button { height: 68px; } .cookie .say { max-width: 200px; } }

/* 걷기: 컨테이너를 translateX 로 옮기고, 방향은 이미지 좌우반전. 걷는 동안 살짝 통통 */
.cookie { transition: transform .6s var(--ease); will-change: transform; }
.cookie.walking { transition: none; }
.cookie.walking img { animation: bob .42s ease-in-out infinite alternate; }
.cookie.flip img { transform: scaleX(-1); }
.cookie.home { transition: transform .9s var(--ease); }
@keyframes bob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-3px) rotate(1.5deg); } }
.cookie.flip.walking img { animation: bobflip .42s ease-in-out infinite alternate; }
@keyframes bobflip { from { transform: scaleX(-1) translateY(0) rotate(1deg); } to { transform: scaleX(-1) translateY(-3px) rotate(-1.5deg); } }

/* 어려울 때 누르는 버튼 — 헤더 오른쪽. 누르면 아래로 말풍선 */
.hard { position: relative; }
.hard > button { font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: -.01em; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--sub); cursor: pointer; box-shadow: var(--sh-1), var(--hi);
  white-space: nowrap; transition: all .18s var(--ease); }
.hard > button:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); transform: translateY(-1px); }
.hard .say { position: absolute; right: 0; top: calc(100% + 10px); z-index: 25; white-space: nowrap;
  background: var(--fg); color: var(--bg); font-weight: 800; font-size: 15px; letter-spacing: -.02em;
  padding: 11px 16px; border-radius: 16px 6px 16px 16px; box-shadow: var(--sh-3); animation: pop .2s var(--ease); }
.hard .say::before { content: ''; position: absolute; right: 16px; top: -7px; border: 7px solid transparent; border-bottom-color: var(--fg); border-top: 0; }
.hard .say.out { animation: fade .3s ease-in forwards; }
@media (max-width: 680px) { .hard { align-self: flex-start; } .hard .say { right: auto; left: 0; border-radius: 6px 16px 16px 16px; } .hard .say::before { right: auto; left: 16px; } }

/* 2) 쿠키 잠자기 (00~06시): 옆으로 기울어 눕고 z z z. 3) 연타하면 부르르 떨고 삐진다 */
.cookie.sleeping button { cursor: default; }
.cookie.sleeping img { transform: rotate(78deg) translateY(-6px); filter: drop-shadow(0 6px 10px rgba(16,24,40,.25)) saturate(.8); transition: transform .6s var(--ease); }
.cookie .zzz { font-weight: 800; letter-spacing: .12em; color: var(--muted); font-size: 13px; margin-right: 26px; animation: zzz 2.4s ease-in-out infinite; }
@keyframes zzz { 0%,100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
.cookie.shake img { animation: shake .5s ease-in-out 1; }
@keyframes shake { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-5px) rotate(-4deg); } 40% { transform: translateX(5px) rotate(4deg); } 60% { transform: translateX(-4px) rotate(-3deg); } 80% { transform: translateX(4px) rotate(3deg); } }
.cookie.sulk img { filter: grayscale(.7) drop-shadow(0 6px 10px rgba(16,24,40,.25)); transform: scaleX(-1); }

/* 쿠키 메뉴(냥 패널) — 기본 닫힘. 공부를 거슬리지 않게 헤더 버튼으로만 연다 */
.paw { position: relative; }
.paw > button { font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: -.01em; padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; transition: all .18s var(--ease); }
.paw > button:hover, .paw.on > button { color: var(--fg); border-color: color-mix(in srgb, var(--acc) 45%, var(--line)); transform: translateY(-1px); }
.nyang { position: fixed; right: 18px; bottom: 108px; z-index: 40; width: min(340px, calc(100vw - 36px));
  max-height: min(70vh, 620px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--sh-3); padding: 14px 16px 16px; }
.nyang[hidden] { display: none !important; }
.nyang h3 { margin: 0 0 2px; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.nyang .who { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
.nyang .nx { position: absolute; right: 12px; top: 12px; border: 0; background: color-mix(in srgb, var(--fg) 7%, transparent);
  color: var(--muted); width: 26px; height: 26px; border-radius: 999px; cursor: pointer; font-size: 15px; line-height: 1; }
.nyang section { border-top: 1px solid var(--line); padding: 11px 0 3px; }
.nyang section:first-of-type { border-top: 0; }
.nyang .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; margin-bottom: 6px; }
.nyang .big { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
.nyang p { margin: 4px 0; font-size: 12.5px; line-height: 1.55; }
.nyang a { color: var(--acc); font-weight: 700; text-decoration: none; }
.nyang a:hover { text-decoration: underline; }
.nyang .mini { font: inherit; font-size: 11.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); transition: all .18s var(--ease); }
.nyang .mini:hover { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); transform: translateY(-1px); }
.nyang .row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.nyang ul { margin: 4px 0 0; padding-left: 16px; font-size: 12.5px; line-height: 1.6; }
.nyang .chip2 { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: color-mix(in srgb, var(--acc) 12%, transparent); color: var(--acc); margin: 2px 4px 2px 0; }
.nyang .gauge { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 8%, transparent); overflow: hidden; margin-top: 5px; }
.nyang .gauge i { display: block; height: 100%; background: var(--grad); transition: width .4s var(--ease); }
.nyang label.goal { display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; cursor: pointer; }
.nyang label.goal input { accent-color: var(--acc); width: 15px; height: 15px; }
.nyang label.goal.done span { text-decoration: line-through; color: var(--muted); }
.nyang .pomo { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
@media (max-width: 680px) { .nyang { right: 10px; left: 10px; width: auto; bottom: 92px; } }

/* 츄르 주기 / 쓰다듬기 */
.churu { position: fixed; pointer-events: none; z-index: 60; font-size: 22px; animation: churu 1.1s ease-out forwards; }
@keyframes churu { from { opacity: 1; transform: translateY(0) scale(.7); } to { opacity: 0; transform: translateY(-70px) scale(1.25); } }
.cookie.purr img { animation: purr .22s ease-in-out infinite alternate; }
@keyframes purr { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }

/* 집중 모드 (치트키 study) */
html.focusmode body::after { content: ''; position: fixed; inset: 0; background: rgba(8,11,20,.55); z-index: 20; pointer-events: none; }
html.focusmode header, html.focusmode .wrap { position: relative; z-index: 21; }
.focusbar { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg);
  font-weight: 800; font-size: 13px; padding: 8px 16px; border-radius: 999px; box-shadow: var(--sh-3); font-variant-numeric: tabular-nums; }

/* 사과비 (치트키 apple) */
#applerain { position: fixed; inset: 0; pointer-events: none; z-index: 46; overflow: hidden; }
#applerain span { position: absolute; font-size: 26px; will-change: transform; }
#applerain.out { transition: opacity .5s; opacity: 0; }

/* 4) D-3 부터 칩이 숨쉬듯 펄스, D-DAY 엔 폭죽 캔버스 */
.dday.soon { animation: breathe 2.2s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

/* 5) 시간대 하늘 — JS 가 <html data-sky> 를 시간대에 맞춰 바꾸면 캔버스 메시 색이 따라간다. 알파는 낮게 */
:root[data-sky="dawn"]    { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(139,92,246,.13), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(236,72,153,.09), transparent 62%); }
:root[data-sky="morning"] { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(56,189,248,.13), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(250,204,21,.08), transparent 62%); }
:root[data-sky="day"]     { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(79,109,245,.11), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(45,212,191,.09), transparent 62%); }
:root[data-sky="dusk"]    { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(251,146,60,.13), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(244,114,182,.10), transparent 62%); }
:root[data-sky="night"]   { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(67,56,202,.14), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(30,64,175,.10), transparent 62%); }
@media (prefers-color-scheme: dark) {
  :root[data-sky="dawn"]    { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(167,139,250,.16), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(244,114,182,.10), transparent 62%); }
  :root[data-sky="morning"] { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(125,211,252,.14), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(253,224,71,.07), transparent 62%); }
  :root[data-sky="day"]     { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(123,143,247,.16), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(94,234,212,.10), transparent 62%); }
  :root[data-sky="dusk"]    { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(251,146,60,.14), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(244,114,182,.11), transparent 62%); }
  :root[data-sky="night"]   { --splash: radial-gradient(1000px 520px at 10% -12%, rgba(99,102,241,.15), transparent 62%), radial-gradient(900px 480px at 90% -8%, rgba(59,130,246,.09), transparent 62%); }
}

/* 6) 이번 주 왕관 — 가장 최근 회차에서 리뷰 good 비율이 가장 높은 현역 1명 */
.av.king { overflow: visible; }
.av.king::after { content: '👑'; position: absolute; top: -13px; left: 50%; transform: translateX(-50%) rotate(-8deg); font-size: 13px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.card .king { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: var(--gold); color: #4a2a00; letter-spacing: -.01em; box-shadow: 0 2px 8px -2px rgba(245,158,11,.5); }

/* 치트키: 아무 데서나 "cookie" 를 치면 쿠키 떼가 화면을 가로질러 뛰어다닌다 */
#stampede { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
#stampede img { position: absolute; will-change: transform; filter: drop-shadow(0 6px 8px rgba(16,24,40,.25)); animation: gallop .32s ease-in-out infinite alternate; }
#stampede img.flip { animation-name: gallopflip; }
#stampede.out img { transition: opacity .5s; opacity: 0; }
@keyframes gallop { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-8px) rotate(3deg); } }
@keyframes gallopflip { from { transform: scaleX(-1) translateY(0) rotate(3deg); } to { transform: scaleX(-1) translateY(-8px) rotate(-3deg); } }

/* ---------- 필터 바 ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
input, select { font: inherit; font-size: 14px; font-weight: 500; padding: 9px 13px; color: var(--fg);
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); box-shadow: var(--sh-1), var(--hi);
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease); }
select { padding-right: 32px; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input:hover, select:hover { border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-ring); }
input[type=search] { min-width: 240px; }
input::placeholder { color: var(--faint); }
label.chk { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500;
  color: var(--sub); cursor: pointer; padding: 8px 12px; border-radius: var(--r-md); transition: background .18s var(--ease); }
label.chk:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
label.chk input { box-shadow: none; accent-color: var(--accent); width: 16px; height: 16px; }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 6px 10px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 4%, transparent); }

/* ---------- 문제 목록 표 ---------- */
table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--sh-2), var(--hi); }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; padding: 14px 18px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, var(--panel-2)), var(--panel-2)); }
td { padding: 15px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; transition: background .14s var(--ease); }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
tr.row:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.row:hover .ttl { color: var(--accent-strong); }
.ttl { font-weight: 650; font-size: 15px; letter-spacing: -.02em; transition: color .14s var(--ease); }
.tag { display: inline-block; padding: 3px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 600;
  font-family: var(--mono); letter-spacing: 0; border: 1px solid var(--line); color: var(--sub); background: var(--panel-2); white-space: nowrap; }

/* 아바타: 겹쳐 쌓인 스택 */
.who { display: flex; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; margin-left: -3px;
  font-size: 11px; font-weight: 700; background: var(--line-soft); color: var(--faint);
  box-shadow: 0 0 0 2px var(--panel); transition: transform .18s var(--ease); position: relative; }
.av:first-child { margin-left: 0; }
.av:hover { transform: translateY(-2px); z-index: 1; }
.av.has { background: var(--grad); color: #fff; }
.av.has[title="김준수"] { background: var(--c-junsoo); }
.av.has[title="안찬웅"] { background: var(--c-chanung); }
.av.has[title="이성일"] { background: var(--c-seongil); }
.av.has[title="전홍선"] { background: var(--c-hongseon); }
.av.has[title="이승주"] { background: var(--c-seungjoo); }
.av.rev { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ok); }

/* ---------- 문제 상세 ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px; font-size: 13.5px; font-weight: 600; text-decoration: none;
  color: var(--muted); padding: 6px 10px 6px 8px; border-radius: 999px; transition: color .18s var(--ease), background .18s var(--ease); }
.back:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); }
.phead { margin-bottom: 22px; }
.phead h2 { margin: 0 0 10px; font-size: clamp(24px, 2.6vw, 34px); font-weight: 800; letter-spacing: -.04em; line-height: 1.15;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.phead .meta { color: var(--muted); font-size: 13.5px; font-weight: 500; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.tabs { display: none; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; box-shadow: var(--sh-1);
  transition: all .18s var(--ease); }
.tabs button:hover { color: var(--fg); border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
.tabs button.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

.cols { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.cols.n1 { grid-template-columns: minmax(0, 780px); }
.cols.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden;
  box-shadow: var(--sh-2), var(--hi); transition: box-shadow .22s var(--ease), border-color .22s var(--ease); }
.col:hover { box-shadow: var(--sh-3), var(--hi); }
.col > h3 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); background: var(--panel-2);
  font-size: 14px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.col > h3::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--grad); flex: none;
  box-shadow: 0 0 0 3px var(--accent-soft); }
.col > h3 .sub { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
pre.code { margin: 0; padding: 18px; overflow-x: auto; background: var(--code-bg);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7; tab-size: 4; letter-spacing: 0; }
pre.code .k { color: var(--kw); font-weight: 600; } pre.code .s { color: var(--str); }
pre.code .c { color: var(--com); font-style: italic; } pre.code .n { color: var(--num); }

.expand-btn { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: all .18s var(--ease); }
.expand-btn:hover { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.tabs.foc-tabs { display: flex; }
.tabs.foc-tabs .back { margin-left: auto; margin-bottom: 0; }
.focus { display: flex; align-items: stretch; gap: 0; }
.focus-code { flex: 1 1 0; min-width: 0; }
.focus-code pre.code { font-size: 14.5px; }
.focus-resizer { flex: 0 0 14px; margin: 0 -3px; cursor: col-resize; position: relative; touch-action: none; align-self: stretch; }
.focus-resizer::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px;
  background: var(--line); border-radius: 2px; transition: background .18s var(--ease); }
.focus-resizer:hover::after, .focus-resizer.active::after { background: var(--accent); }
.focus-review { flex: 0 1 var(--rev-w, 400px); min-width: 240px; max-width: 82%; align-self: start; }
.focus-review > details.rev, .focus-review > .norev { border-top: 0; }

/* ---------- 익명 댓글 (크게 보기 전용) ----------
   풀이 하나(문제 × 작성자)에 스레드 하나. Supabase REST 로 저장한다 — SDK 없이 fetch 만.
   CMT 가 비어 있거나 fetch 가 없는 환경(스모크 VM·file://)에서는 안내만 띄우고 조용히 넘어간다. */
.cmt { margin-top: 18px; border-top: 1px solid var(--line-soft); padding-top: 16px; }
.cmt h4 { margin: 0 0 10px; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.cmt h4 .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.cmt-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.cmt-item { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 13px; }
.cmt-item .who { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.cmt-item .who b { font-size: 12.5px; color: var(--sub); font-weight: 700; }
.cmt-item .body { font-size: 14px; line-height: 1.6; color: var(--fg); white-space: pre-wrap; word-break: break-word; }
.cmt-empty { font-size: 13px; color: var(--muted); padding: 10px 0 4px; }
.cmt-form { display: flex; flex-direction: column; gap: 8px; }
.cmt-form input, .cmt-form textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.cmt-form input { width: 220px; max-width: 60%; }
.cmt-form textarea { resize: vertical; min-height: 74px; line-height: 1.6; }
.cmt-form input:focus, .cmt-form textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.cmt-form .act { display: flex; align-items: center; gap: 10px; }
.cmt-form .act .hint { font-size: 12px; color: var(--faint); }
.cmt-send { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 0;
  background: var(--accent); color: #fff; cursor: pointer; transition: filter .18s var(--ease); }
.cmt-send:hover { filter: brightness(1.06); }
.cmt-send[disabled] { opacity: .5; cursor: default; }
.cmt-msg { font-size: 12.5px; color: var(--bad); }
.cmt-off { font-size: 13px; color: var(--muted); line-height: 1.7; }
.cmt-off code { font-size: 12px; background: var(--code-bg); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1px 5px; }
.ref-note { padding: 12px 18px 0; font-size: 12.5px; color: var(--muted); }

/* T4-3. 정석 코드 diff */
.reftabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 4px; }
.reftabs button { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; transition: all .18s var(--ease); }
.reftabs button.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.refpane { display: none; } .refpane.on { display: block; }
.refsrc { font-size: 12px; margin: 8px 0; }
pre.code.diff span { display: block; padding-left: 22px; text-indent: -14px; margin: 0 -18px 0 0; }
pre.code.diff .dm { background: color-mix(in srgb, var(--bad) 12%, transparent); }
pre.code.diff .dp { background: color-mix(in srgb, var(--ok) 12%, transparent); }
pre.code.diff .dfold { color: var(--muted); font-style: italic; background: var(--line-soft); }
.difflegend { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); margin: 0 0 8px; flex-wrap: wrap; }
.difflegend .m { color: var(--bad); } .difflegend .p { color: var(--ok); }
details.rev.ref, .norev.ref { border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); border-radius: var(--r-xl);
  margin-bottom: 18px; overflow: hidden; background: var(--accent-soft); box-shadow: var(--sh-1); }
details.rev.ref > summary { border-radius: 0; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  background: transparent; font-size: 14px; padding: 14px 18px; width: 100%; box-sizing: border-box; }
details.rev.ref[open] > summary { border-bottom: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); }
details.rev.ref .rev-body { background: var(--panel); padding: 18px; }
.norev.ref { border-top: 0; padding: 16px 18px; font-size: 13.5px; color: var(--sub); }

/* ---------- 배지 ---------- */
.badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; border: 0; letter-spacing: 0;
  display: inline-flex; align-items: center; gap: 5px; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.b-good { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
.b-needs-fix { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.b-wrong, .b-nc { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.b-unattempted { background: var(--line-soft); color: var(--muted); }

/* ---------- 리뷰 접이식 ---------- */
details.rev { border-top: 1px solid var(--line-soft); padding: 14px 18px; }
details.rev > summary { cursor: pointer; font-size: 13px; font-weight: 700;
  color: var(--accent-strong); background: var(--accent-soft); list-style: none;
  display: inline-flex; gap: 7px; align-items: center; user-select: none;
  padding: 9px 16px; border: 0; border-radius: 999px; transition: background .18s var(--ease), transform .18s var(--ease); }
details.rev > summary:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
details.rev > summary:active { transform: scale(.98); }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev > summary::before { content: "▸"; font-size: 11px; transition: transform .18s var(--ease); }
details.rev[open] > summary::before { content: "▾"; }
details.rev > summary .t-close, details.rev[open] > summary .t-open { display: none; }
details.rev[open] > summary .t-close { display: inline; }
.rev-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 16px 0 4px; }
details.rev.alt > summary { color: var(--muted); background: color-mix(in srgb, var(--fg) 5%, transparent); }
details.rev.alt > summary:hover { background: color-mix(in srgb, var(--fg) 9%, transparent); }
details.rev.alt .rev-meta:first-child { margin-top: 4px; }
.rev-body { padding: 6px 2px; font-size: 14px; color: var(--sub); line-height: 1.7; }
.rev-body h1 { display: none; }
.rev-body h2 { font-size: 15px; font-weight: 750; color: var(--fg); letter-spacing: -.02em;
  margin: 24px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
.rev-body h3 { font-size: 14px; font-weight: 700; color: var(--fg); margin: 18px 0 6px; }
.rev-body pre.code { border: 1px solid var(--line-soft); border-radius: var(--r-md); margin: 10px 0; font-size: 12px; background: var(--code-bg); }
.rev-body code { background: color-mix(in srgb, var(--fg) 6%, transparent); border: 0;
  padding: 2px 6px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--fg); }
.rev-body pre.code code { background: none; border: 0; padding: 0; }
.rev-body ul { padding-left: 20px; } .rev-body li { margin: 5px 0; }
details.rev.fb, .norev.fb { background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-xl); margin-bottom: 18px; overflow: hidden; box-shadow: var(--sh-1), var(--hi); }
.norev.fb { border-top: 1px solid var(--line); }
.norev { padding: 14px 18px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 13px; }
.norev code { font-family: var(--mono); font-size: 12px; background: color-mix(in srgb, var(--fg) 6%, transparent);
  padding: 2px 6px; border-radius: 6px; border: 0; }

/* ---------- 사람별 카드 ---------- */
.cards { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; position: relative;
  box-shadow: var(--sh-1), var(--hi); transition: box-shadow .22s var(--ease), transform .22s var(--ease), border-color .22s var(--ease); }
.card::before { content: ''; position: absolute; left: 24px; right: 24px; top: 0; height: 3px; border-radius: 0 0 3px 3px;
  background: var(--jewel); opacity: .9; transition: opacity .22s var(--ease); }
.card:hover { box-shadow: var(--sh-3), var(--hi); transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.card:hover::before { opacity: 1; height: 4px; }
.card h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; }
.card .id { color: var(--faint); font-size: 12px; font-family: var(--mono); }
.stats { display: flex; gap: 22px; margin: 20px 0; }
.stat b { display: block; font-size: clamp(26px, 2.3vw, 32px); font-weight: 800; line-height: 1.05; letter-spacing: -.045em;
  background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.card h4 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; font-weight: 700; }
.trow { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 7px 0; }
.trow .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sub); }
.trow .bar-bg { width: 72px; height: 6px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
.trow .bar-fg { height: 100%; background: var(--jewel); border-radius: 999px; }
.trow .num { width: 20px; text-align: right; color: var(--muted); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

.note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-xl); border-left: 3px solid var(--accent);
  padding: 16px 20px; margin-bottom: 22px; font-size: 13.5px; color: var(--sub); box-shadow: var(--sh-1), var(--hi); }
.note b { color: var(--fg); }

/* ---------- 반응형 ---------- */
@media (max-width: 1200px) { .cols:not(.n1):not(.n2) { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) !important; }
  .cols.tabbed > .col { display: none; }
  .cols.tabbed > .col.on { display: block; }
  .tabs { display: flex; }
  .focus { flex-direction: column; }
  .focus-resizer { display: none; }
  .focus-review { flex-basis: auto; max-width: 100%; }
}

/* ---------- 모바일 (휴대폰 폭) ---------- */
@media (max-width: 680px) {
  .wrap { padding: 0 12px 72px; }
  header { position: static; }
  .head-in { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; }
  h1 { font-size: 17px; }
  h1 span { display: block; margin-left: 0; margin-top: 2px; }
  nav { margin-left: 0; width: 100%; justify-content: space-between; }
  nav a { flex: 1; text-align: center; padding: 8px 10px; }
  .dday { align-self: flex-start; }

  .bar { flex-direction: column; align-items: stretch; }
  .bar > select, .bar > input, .bar > label.chk { width: 100%; }
  .bar > .count { margin-left: 0; text-align: right; }

  .cards { grid-template-columns: 1fr; gap: 12px; }
  .card { padding: 18px; }
  .card:hover { transform: none; }
  .stats { gap: 16px; flex-wrap: wrap; }

  .phead h2 { font-size: 22px; }

  /* 표 → 카드형 리스트로. 헤더 행을 숨기고 각 td를 라벨+값 줄로 펼친다. */
  table { border: 0; background: none; box-shadow: none; border-radius: 0; }
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tbody tr, tr.row {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 4px 16px; margin-bottom: 10px; box-shadow: var(--sh-1), var(--hi);
  }
  tbody tr:last-child, tr.row:last-child { margin-bottom: 0; }
  tr.row:hover td:first-child { box-shadow: none; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
  td:last-child { border-bottom: 0; }
  td:not([data-label]) { padding: 13px 0 9px; }
  td:not([data-label]) .ttl { font-size: 16px; }
  td[data-label] { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  td[data-label]::before {
    content: attr(data-label); font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 700; flex-shrink: 0;
  }
  .who { justify-content: flex-end; }

  pre.code { font-size: 11.5px; padding: 13px; }
}
/* 애니메이션을 줄여달라는 OS 설정을 존중한다 */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  html { scroll-behavior: auto; }
  .card:hover, .cookie button:hover, .av:hover { transform: none; }
}
</style>
</head>
<body>
<header><div class="head-in">
  <h1><a href="#/" id="home">SSAFY 16기 알고리즘</a> <span id="sub"></span></h1>
  <nav><a href="#/" id="nav-p">문제</a><a href="#/people" id="nav-w">사람별</a><a href="#/rotation" id="nav-r">로테이션</a></nav>
  <div class="wx" id="wx"></div>
  <div class="dday" id="dday" title="SSAFY A형 시험 2026-09-14"></div>
  <div class="hard" id="hard"><button type="button" id="hard-btn">어려울 때 누르는 버튼</button><div class="say" id="hard-say" role="status" hidden></div></div>  <div class="paw" id="paw"><button type="button" id="paw-btn" aria-expanded="false">🐾 쿠키 메뉴</button></div>
</div></header>
<div class="wrap" id="app"></div>
<div class="anx" id="anx">
  <div class="bubble" id="anx-bubble" hidden>내가 더 불안하다 임마 <button type="button" class="x" id="anx-close" aria-label="닫기">×</button></div>
  <button type="button" id="anx-btn">불안한 사람 보세요</button>
</div>
<div class="cookie" id="cookie">
  <div class="say" id="cookie-say" role="status" hidden></div>
  <div class="zzz" id="cookie-zzz" aria-hidden="true" hidden>z z z</div>
  <button type="button" id="cookie-btn" aria-label="쿠키" title="쿠키"><img src="assets/cookie.png" alt=""></button>
</div><div class="nyang" id="nyang" role="dialog" aria-label="쿠키 메뉴" hidden></div>

<script src="data/bundle.js"></script>
<script>
const D = window.STUDY_DATA;
const app = document.getElementById('app');
// classList.toggle 대신 add/remove — 스모크 VM 의 DOM 스텁엔 toggle 이 없다
const tog = (el, c, on) => el && el.classList && el.classList[on ? 'add' : 'remove'](c);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = n => n.length > 1 ? n.slice(1, 3) : n;
const authorName = id => (D.authors.find(a => a.id === id) || {}).displayName || id;

// 떠난 사람의 코드도 그냥 보인다 — 있던 회차까지의 파일만 인덱서가 넘겨주므로 여기서 감출 게 없다.
// 다만 "N명 다 푼" 기준과 미제출 현황은 현역만 센다. 앞으로 제출할 사람이 그들이니까.
const activeAuthors = () => D.authors.filter(a => a.active !== false);
/* 이번 주 왕관: 가장 최근 회차(week 최대)에서, 리뷰가 붙은 풀이 중 good 비율이 가장 높은 현역 1명.
   동률이면 good 개수 → 그 회차 풀이 수. 그 회차에 리뷰가 하나도 없으면 왕관 없음. */
function weeklyKing() {
  const act = new Set(D.authors.filter(a => a.active !== false).map(a => a.id));
  const es = D.problems.flatMap(p => p.entries.filter(e => act.has(e.author) && e.week));
  if (!es.length) return null;
  const W = Math.max(...es.map(e => e.week));
  const per = {};
  es.filter(e => e.week === W).forEach(e => {
    const s = (per[e.author] ??= { n: 0, rev: 0, good: 0 });
    s.n++; if (e.review) { s.rev++; if (e.review.verdict === 'good') s.good++; }
  });
  const rows = Object.entries(per).filter(([, s]) => s.rev > 0)
    .map(([id, s]) => ({ id, ratio: s.good / s.rev, ...s }))
    .sort((a, b) => b.ratio - a.ratio || b.good - a.good || b.n - a.n);
  return rows.length ? { id: rows[0].id, week: W, good: rows[0].good, rev: rows[0].rev } : null;
}
const KING = weeklyKing();
// 목록 행의 아바타: 현역 전원 + 그 문제를 실제로 푼 사람(떠난 사람 포함)
const rowAuthors = p => D.authors.filter(a => a.active !== false || p.entries.some(e => e.author === a.id));
const tagLabel = id => (D.tags.find(t => t.id === id) || {}).label || id;

// 헤더 부제는 갱신 날짜만. 문제·풀이 수는 요청으로 뺐다 (2026-09-07)
document.getElementById('sub').textContent = '업데이트: ' + String(D.generatedAt).slice(0, 10);

/* ---------- 시험 D-day ----------
   시험이 생기면 EXAMS 에 한 줄 추가한다. 가장 가까운 앞으로의 시험 하나를 칩으로 띄우고,
   지난 시험은 하루 동안 D+1 로 보여준 뒤 자동으로 다음 시험으로 넘어간다.
   날짜만 비교한다 — 시각을 섞으면 자정 직전에 하루가 밀려 보인다.
   자정을 넘겨도 값이 맞도록 한 시간마다 다시 계산한다. */
const EXAMS = [
  { date: '2026-09-14', label: 'A형 시험' },
];
function renderDday() {
  const el = document.getElementById('dday');
  if (!el) return;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const items = EXAMS.map(x => {
    const [y, m, d] = x.date.split('-').map(Number);
    return { ...x, m, d, left: Math.round((new Date(y, m - 1, d) - today) / 86400000) };
  }).sort((a, b) => a.left - b.left);
  // 앞으로 것 중 가장 가까운 것. 없으면 가장 최근에 지난 것(하루만).
  const pick = items.find(x => x.left >= 0) || items.filter(x => x.left === -1)[0];
  if (!pick) { el.className = 'dday past'; el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const left = pick.left;
  el.className = 'dday' + (left === 0 ? ' today' : left < 0 ? ' past' : left <= 3 ? ' soon' : '');
  el.title = pick.label + ' ' + pick.date;
  el.innerHTML = '<span>' + esc(pick.label) + '</span>'
    + '<span class="d">' + (left > 0 ? 'D-' + left : left === 0 ? 'D-DAY' : 'D+' + -left) + '</span>'
    + '<span class="when">' + esc(pick.m + '월 ' + pick.d + '일') + '</span>';
}
renderDday();

/* 5) 시간대 하늘: 시간에 따라 <html data-sky> 를 바꾼다. 색은 CSS 가 들고 있다 */
function paintSky() {
  if (typeof document === 'undefined' || !document.documentElement) return;
  const hr = new Date().getHours();
  const sky = hr < 6 ? 'dawn' : hr < 11 ? 'morning' : hr < 17 ? 'day' : hr < 20 ? 'dusk' : 'night';
  if (document.documentElement.dataset) document.documentElement.dataset.sky = sky;
}
paintSky();
if (typeof setInterval === 'function') setInterval(paintSky, 10 * 60 * 1000);

/* 4) D-DAY 폭죽: 시험 당일 처음 열 때 한 번. 하루에 한 번만(localStorage), 애니메이션 줄이기면 안 터진다 */
function confettiOnce() {
  if (typeof document === 'undefined' || !document.createElement || typeof requestAnimationFrame !== 'function') return;
  if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const hit = EXAMS.find(x => { const [y, m, d] = x.date.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - today) / 86400000) === 0; });
  if (!hit) return;
  const key = 'confetti-' + hit.date;
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) {}
  const cv = document.createElement('canvas'); cv.id = 'confetti'; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const w = cv.width = innerWidth, hgt = cv.height = innerHeight;
  const colors = ['#4f6df5', '#7c5cf6', '#ff7a59', '#fbbf24', '#12a370', '#ff5e7a'];
  const ps = Array.from({ length: 160 }, () => ({ x: w / 2 + (Math.random() - .5) * w * .3, y: hgt * .35,
    vx: (Math.random() - .5) * 14, vy: -8 - Math.random() * 9, r: 4 + Math.random() * 5, a: Math.random() * 6.28, va: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = Date.now();
  (function frame() {
    const t = (Date.now() - t0) / 1000;
    ctx.clearRect(0, 0, w, hgt);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - 2) / 1); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t < 3.2) requestAnimationFrame(frame); else cv.remove();
  })();
}
confettiOnce();
// 스모크 테스트는 타이머 없는 VM 에서 이 스크립트를 돌린다
if (typeof setInterval === 'function') setInterval(renderDday, 3600000);

/* ---------- 불안한 사람 보세요 ---------- */
(function () {
  const box = document.getElementById('anx'), btn = document.getElementById('anx-btn'),
        bub = document.getElementById('anx-bubble');
  if (!box || !btn || !bub) return;
  const set = open => { bub.hidden = !open; box.classList[open ? 'add' : 'remove']('open'); };
  btn.addEventListener('click', () => set(bub.hidden));
  const x = document.getElementById('anx-close');
  if (x) x.addEventListener('click', e => { e.stopPropagation(); set(false); });
  if (typeof addEventListener === 'function') addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
})();

/* ---------- 쿠키 한 마디 ----------
   누르면 아래 여섯 마디 중 하나를 랜덤으로 말한다(팀원이 정한 문장 그대로).
   어떤 문장이든 끝은 반드시 "냥" — 코드가 강제한다. 3초 뒤 스스로 사라진다. */
const COOKIE_LINES = [
  '오늘 알고리즘 풀었냐냥',
  '싸탈 마렵다냥',
  '배고프다냥',
  '졸리다냥',
  '힘내라냥',
  '기운내냥',
];
let cookieLast = -1;
function cookieLine() {
  // 같은 말이 연달아 나오지 않게 직전 것은 뺀다
  let i; do { i = Math.floor(Math.random() * COOKIE_LINES.length); } while (COOKIE_LINES.length > 1 && i === cookieLast);
  cookieLast = i;
  let s = COOKIE_LINES[i];
  if (!s.endsWith('냥')) s += '냥'; // 규칙: 마지막 말은 냥
  return s;
}
/* 쿠키는 화면 아래를 천천히 걸어다닌다.
   - 한 번 클릭: 멈춰서 한 마디, 4초 뒤 다시 걷는다.
   - 두 번 연속 클릭(400ms 안): 제자리(오른쪽 아래)로 돌아가서 다시는 안 걷는다. localStorage 에 기억한다.
     또 두 번 연속 누르면 다시 걷기 시작한다(토글).
   가장자리에 닿으면 방향을 바꾸고 이미지를 좌우반전한다. 애니메이션 줄이기 설정이면 걷지 않고 한 마디만 한다. */
const CK_STILL_KEY = 'cookie-still';
(function () {
  const box = document.getElementById('cookie'), btn = document.getElementById('cookie-btn'), say = document.getElementById('cookie-say');
  if (!box || !btn || !say) return;
  const canMove = typeof requestAnimationFrame === 'function' && typeof innerWidth === 'number'
    && !(typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let still = false; try { still = localStorage.getItem(CK_STILL_KEY) === '1'; } catch (e) {}
  const zzz = document.getElementById('cookie-zzz');
  // 2) 00~06시엔 잔다. 눕고 z z z, 걷지 않는다. 눌러도 "…냥"
  const isSleepHour = () => { const hr = new Date().getHours(); return hr >= 0 && hr < 6; };
  let sleeping = false;
  const applySleep = () => {
    const s = isSleepHour(); if (s === sleeping) return; sleeping = s;
    tog(box, 'sleeping', s); if (zzz) zzz.hidden = !s;
  };
  // 3) 연타: 5초 안에 5번이면 부르르 + "그만 눌러라냥", 10초 삐짐(무반응). 풀리고 첫 클릭엔 사과를 요구한다
  let taps = [], sulkUntil = 0, wantsApology = false;
  let state = 'stopped', x = 0, dir = -1, timer = null, resumeTimer = null, lastClick = 0; // x: 제자리에서 왼쪽으로 간 거리(px)
  const SPEED = 0.55; // px/frame ≈ 33px/s — 어슬렁거리는 속도
  const speak = () => {
    if (timer && typeof clearTimeout === 'function') clearTimeout(timer);
    say.className = 'say'; say.hidden = false; say.textContent = cookieLine();
    if (typeof setTimeout !== 'function') return;
    timer = setTimeout(() => { say.className = 'say out'; timer = setTimeout(() => { say.hidden = true; }, 320); }, 3000);
  };
  const paint = () => { box.style.transform = 'translateX(' + (-x) + 'px)'; tog(box, 'flip', dir > 0); };
  const setState = s => { state = s; tog(box, 'walking', s === 'walking'); tog(box, 'home', s === 'home'); };
  const goHome = () => { x = 0; dir = -1; setState('home'); paint(); };
  const cancelResume = () => { if (resumeTimer && typeof clearTimeout === 'function') clearTimeout(resumeTimer); resumeTimer = null; };
  function frame() {
    applySleep();
    if (state === 'walking' && !still && !sleeping) {
      const max = Math.max(0, innerWidth - btn.offsetWidth - 40);
      x += -dir * SPEED; // dir -1 = 왼쪽으로
      if (x >= max) { x = max; dir = 1; } else if (x <= 0) { x = 0; dir = -1; }
      paint();
    }
    requestAnimationFrame(frame);
  }
  const sayText = txt => {
    if (timer && typeof clearTimeout === 'function') clearTimeout(timer);
    say.className = 'say'; say.hidden = false; say.textContent = txt.endsWith('냥') ? txt : txt + '냥';
    if (typeof setTimeout !== 'function') return;
    timer = setTimeout(() => { say.className = 'say out'; timer = setTimeout(() => { say.hidden = true; }, 320); }, 3000);
  };
  btn.addEventListener('click', () => {
    const now = Date.now();
    if (now < sulkUntil) return;                                       // 삐진 동안엔 무반응
    if (wantsApology) { wantsApology = false; sayText('…미안하면 문제나 풀어라냥'); return; }
    taps = taps.filter(t => now - t < 5000); taps.push(now);
    if (taps.length >= 5) {
      taps = []; sulkUntil = now + 10000; wantsApology = true;
      box.classList.add('shake'); if (typeof setTimeout === 'function') setTimeout(() => { box.classList.remove('shake'); box.classList.add('sulk'); }, 500);
      if (typeof setTimeout === 'function') setTimeout(() => box.classList.remove('sulk'), 10000);
      sayText('그만 눌러라냥'); return;
    }
    if (sleeping) { sayText('…냥'); return; }
    if (!canMove) { speak(); return; }
    const dbl = now - lastClick < 400; lastClick = now;
    if (dbl) {                                   // 두 번 연속: 안 움직이기 ↔ 다시 걷기 토글
      still = !still; try { localStorage.setItem(CK_STILL_KEY, still ? '1' : '0'); } catch (e) {}
      cancelResume();
      if (still) { goHome(); } else { setState('walking'); }
      return;
    }
    if (still) { speak(); return; }             // 안 움직이는 상태: 한 마디만
    if (state === 'walking') {                   // 한 번: 멈춰서 한 마디, 4초 뒤 다시 걷기
      setState('stopped'); speak(); cancelResume();
      if (typeof setTimeout === 'function') resumeTimer = setTimeout(() => { if (state === 'stopped' && !still) setState('walking'); }, 4000);
      return;
    }
    speak();
  });
  applySleep();
  if (canMove) {
    if (still || sleeping) { goHome(); }
    else { setState('walking'); setTimeout(() => requestAnimationFrame(frame), 1500); } // 페이지 뜨고 잠시 뒤 출발
    if (still) requestAnimationFrame(frame); // 나중에 토글로 다시 걷게 될 때를 위해 루프는 돌려둔다
  }
})();

/* 치트키 — 입력창 밖에서 "cookie" 를 타이핑하면 쿠키 28마리가 3초간 뛰어다니다 사라진다.
   한 번 터지는 동안엔 다시 안 터진다. 애니메이션 줄이기 설정이면 안 나온다. */
const CHEAT = 'cookie';
let cheatBuf = '', stampeding = false;
function stampede() {
  if (stampeding || typeof document === 'undefined' || !document.createElement || typeof requestAnimationFrame !== 'function') return;
  if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stampeding = true;
  const box = document.createElement('div'); box.id = 'stampede'; document.body.appendChild(box);
  const W = innerWidth, H = innerHeight;
  const cats = Array.from({ length: 28 }, (_, i) => {
    const img = document.createElement('img'); img.src = 'assets/cookie.png'; img.alt = '';

  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2, y: innerHeight * .65, vx: (Math.random() - .5) * 16, vy: -6 - Math.random() * 12, a: Math.random() * 6, va: (Math.random() - .5) * .3, r: 5 + Math.random() * 6, c: C[Math.floor(Math.random() * C.length)] }));
  const t0 = Date.now();
  (function frame() {
    const t = (Date.now() - t0) / 1000; ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va;

/* ============================================================

   공부용 6가지 + 재미 5가지를 한 패널에 모았다.
   원칙은 그대로다: 기본 닫힘, 자동으로 안 열림, Esc·× 로 닫힌다.
   데이터는 전부 bundle.js 안의 것만 쓴다 — 외부 호출 0, 지어내지 않는다.

const NY = {

const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* 내 풀이 모으기 — bundle 데이터에서만 */
function myEntries(id) {
  const out = [];
  for (const p of D.problems) for (const e of p.entries) if (e.author === id) out.push({ p, e });
  return out;
}
/* 오늘의 복습 1문제: 리뷰가 needs-fix·wrong 인 내 풀이 중 하나 (날짜 시드로 하루 동안 고정) */
function reviewPick(id) {
  const bad = myEntries(id).filter(x => x.e.review && (x.e.review.verdict === 'needs-fix' || x.e.review.verdict === 'wrong'));
  if (!bad.length) return null;
  return bad[seedInt(id + today(), bad.length)];
}
/* 날짜+이름을 시드로 한 결정적 난수 — 새로고침해도 하루 동안 같은 걸 준다 */
function seedInt(str, n) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h) % n;
}
/* 반복 지적 태그 Top 3 + 어느 문제에서 그랬는지 */
function weakTop(id) {
  const map = {};
  for (const { p, e } of myEntries(id)) {
    if (!e.review) continue;
    for (const t of (e.review.tags || [])) {
      const meta = D.tags.find(d => d.id === t);
      if (meta && meta.group === 'praise') continue;      // 칭찬 태그는 약점이 아니다
      (map[t] = map[t] || []).push(p);
    }
  }
  return Object.entries(map).sort((a, b) => b[1].length - a[1].length).slice(0, 3);
}

/* 가장 가까운 시험까지 남은 날 (없으면 null) */
function ddayLeft() {
  if (typeof EXAMS === 'undefined' || !EXAMS.length) return null;
  const n = new Date(); const today0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  let best = null;
  for (const x of EXAMS) {
    const [y, m, d] = x.date.split('-').map(Number);
    const left = Math.round((new Date(y, m - 1, d) - today0) / 86400000);
    if (left >= 0 && (best === null || left < best)) best = left;
  }
  return best;
}

/* 연속 출석 스트릭 — 어제 왔으면 +1, 건너뛰었으면 1부터 */
function bumpStreak() {
  const t = today();
  const raw = ls.get(NY.streak, '');
  const [last, cntStr] = raw ? raw.split('|') : ['', '0'];
  let cnt = Number(cntStr) || 0;
  if (last === t) return cnt;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  cnt = (last === yStr) ? cnt + 1 : 1;
  ls.set(NY.streak, t + '|' + cnt);
  return cnt;
}

/* ---------- 날씨 연동 ----------
   대전 기준 실황을 받아 비/눈이면 화면에 뿌린다. Open-Meteo — 키 없음, CORS 허용.
   날씨를 못 받으면 아무 효과도 주지 않는다. 지어내지 않는다.
   확인용으로 주소 끝에 ?wx=rain / ?wx=snow / ?wx=none 을 붙이면 강제로 그 상태가 된다. */
const WX = {
  lat: 36.3504, lon: 127.3845, place: '대전',
  url: 'https://api.open-meteo.com/v1/forecast?latitude=36.3504&longitude=127.3845'
     + '&current=weather_code,temperature_2m&timezone=Asia%2FSeoul',
  ttl: 30 * 60 * 1000, // 30분 캐시 — 새로고침마다 두드리지 않는다
};
// WMO 코드 → 우리가 그릴 것. 나머지(맑음·흐림·안개 등)는 효과 없음.
function wxKind(code) {
  if (code == null) return null;
  if ([71, 73, 75, 77, 85, 86].includes(code)) return 'snow';           // 눈·소낙눈
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code))
    return 'rain';                                                       // 이슬비·비·소나기·뇌우
  return null;
}
const WX_LABEL = { rain: { ico: '🌧️', txt: '비' }, snow: { ico: '❄️', txt: '눈' } };

function wxOverride() {
  if (typeof location === 'undefined' || !location.search) return null;
  const m = /[?&]wx=(rain|snow|none)\b/.exec(location.search);
  return m ? m[1] : null;
}

function renderWxChip(kind, temp) {
  const el = typeof document !== 'undefined' && document.getElementById('wx');
  if (!el) return;
  if (!kind) { el.className = 'wx'; el.innerHTML = ''; return; }
  const L = WX_LABEL[kind];
  el.className = 'wx ' + kind;
  el.innerHTML = '<span class="ico">' + L.ico + '</span>'
    + '<span>' + esc(WX.place) + ' ' + L.txt + '</span>'
    + (temp == null ? '' : '<span class="t">' + Math.round(temp) + '°</span>');
}

/* 비/눈 파티클. 캔버스는 pointer-events:none 이라 클릭을 막지 않는다. */
function startWxParticles(kind) {
  if (typeof document === 'undefined' || !document.createElement) return;
  if (typeof requestAnimationFrame !== 'function') return;
  const old = document.getElementById('wx-canvas');
  if (old && old.remove) old.remove();
  if (!kind) return;
  // 애니메이션을 줄여달라는 설정이면 그리지 않는다 (칩으로만 알린다)
  if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const cv = document.createElement('canvas');
  cv.id = 'wx-canvas';
  document.body.appendChild(cv);
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;

  let w, h, parts;
  const N = kind === 'snow' ? 70 : 110; // 코드를 가리지 않을 만큼만
  function reset() {
    w = cv.width = innerWidth; h = cv.height = innerHeight;
    parts = Array.from({ length: N }, () => spawn(Math.random() * h));
  }
  function spawn(y) {
    return kind === 'snow'
      ? { x: Math.random() * w, y, r: 1.5 + Math.random() * 2.5, sp: .4 + Math.random() * .8,
          drift: (Math.random() - .5) * .6, ph: Math.random() * 6.28 }
      : { x: Math.random() * w, y, len: 9 + Math.random() * 14, sp: 7 + Math.random() * 7 };
  }
  reset();
  addEventListener('resize', reset);

  let t = 0;
  (function frame() {
    if (!document.getElementById('wx-canvas')) return; // 교체되면 이 루프는 끝낸다
    ctx.clearRect(0, 0, w, h);
    t += 0.02;
    if (kind === 'snow') {
      ctx.fillStyle = '#ffffff';
      for (const p of parts) {
        p.y += p.sp; p.x += p.drift + Math.sin(t + p.ph) * .4;
        if (p.y > h) { Object.assign(p, spawn(-6)); }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      }
    } else {
      ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      for (const p of parts) {
        p.y += p.sp; p.x += 1.1; // 살짝 사선으로
        if (p.y > h) { Object.assign(p, spawn(-p.len)); }
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 1.6, p.y - p.len); ctx.stroke();
      }
    }
    requestAnimationFrame(frame);
  })();
}

function applyWx(kind, temp) { renderWxChip(kind, temp); startWxParticles(kind); }

function loadWeather() {
  const forced = wxOverride();
  if (forced) return applyWx(forced === 'none' ? null : forced, null);
  if (typeof fetch !== 'function') return; // 스모크 VM 등

  // 캐시가 살아 있으면 그걸 쓴다
  try {
    const c = JSON.parse(localStorage.getItem('wx') || 'null');
    if (c && Date.now() - c.at < WX.ttl) return applyWx(wxKind(c.code), c.temp);
  } catch (e) { /* 캐시가 깨졌으면 그냥 새로 받는다 */ }

  fetch(WX.url)
    .then(r => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then(j => {
      const code = j && j.current && j.current.weather_code;
      const temp = j && j.current && j.current.temperature_2m;
      try { localStorage.setItem('wx', JSON.stringify({ code, temp, at: Date.now() })); } catch (e) {}
      applyWx(wxKind(code), temp);
    })
    .catch(() => { /* file:// 이나 오프라인이면 조용히 넘어간다 — 날씨를 지어내지 않는다 */ });
}
loadWeather();
if (typeof setInterval === 'function') setInterval(loadWeather, WX.ttl);


/* ---------- Java/C++ 하이라이터 ---------- */
// 언어를 엄격히 나누지 않고 두 언어 키워드를 합쳐서 쓴다 — 어차피 서로 다른 키워드는
// 그 언어 코드에 안 나타나므로 겹쳐도 오염되지 않는다.
const KW = 'abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|var|record|true|false|null|' +
  'auto|bool|cin|cout|endl|namespace|using|template|typename|struct|typedef|unsigned|signed|const|constexpr|nullptr|sizeof|virtual|override|inline|friend|operator|union|goto|register|volatile|explicit|mutable|wchar_t';
// 맨 앞 그룹은 #include/#define 같은 C++ 전처리기 지시문 한 줄 전체(주석과 같은 색으로 표시)
const TOKEN = new RegExp('(^[ \\t]*#[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|\\b(\\d[\\d_]*(?:\\.\\d+)?[fdlLuU]?)\\b|\\b(' + KW + ')\\b', 'gm');
function hl(src) {
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += '<span class="' + (m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : 'k') + '">' + esc(m[0]) + '</span>';
    last = TOKEN.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* ---------- 리뷰 마크다운 (쓰는 문법만) ---------- */
function md(src) {
  const fences = [];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    code = code.replace(/\n$/, '');
    fences.push('<pre class="code">' + (lang === 'java' || lang === 'cpp' || !lang ? hl(code) : esc(code)) + '</pre>');
    return '' + (fences.length - 1) + '';
  });
  const inl = s => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  const out = [];
  let list = false;
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const line of src.split('\n')) {
    const t = line.trim();
    if (!t) { closeList(); continue; }
    if (/^\d+$/.test(t)) { closeList(); out.push(t); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length; out.push('<h' + n + '>' + inl(h[2]) + '</h' + n + '>'); continue; }
    const li = t.match(/^[-*]\s+(.*)$/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inl(li[1]) + '</li>'); continue; }
    closeList();
    out.push('<p>' + inl(t) + '</p>');
  }
  closeList();
  return out.join('\n').replace(/(\d+)/g, (_, i) => fences[+i]);
}

let filt = { platform: '', week: '', q: '' };

function viewList() {
  const weeks = [...new Set(D.problems.flatMap(p => p.weeks))].sort((a, b) => a - b);
  const rows = D.problems.filter(p => {
    if (filt.platform && p.platform !== filt.platform) return false;

    if (filt.q && !(p.title + ' ' + p.problemId).toLowerCase().includes(filt.q.toLowerCase())) return false;

  rows.sort((a, b) => {
    const wa = Math.max(0, ...a.weeks), wb = Math.max(0, ...b.weeks);
    if (wa !== wb) return wb - wa;
    const ca = new Set(a.entries.map(e => e.author)).size;

  app.innerHTML =

        weeks.map(w => '<option value="' + w + '"' + (filt.week == w ? ' selected' : '') + '>' + w + '주차</option>').join('') +
      '</select>' +
      '<input type="search" id="f-q" placeholder="문제 제목 / 번호 검색" value="' + esc(filt.q) + '">' +
      '<span class="count">' + rows.length + ' / ' + D.problems.length + '문제</span>' +
    '</div>' +
    (rows.length ? '<table><thead><tr><th>문제</th><th>플랫폼</th><th>회차</th><th>푼 사람</th><th>리뷰</th></tr></thead><tbody>' +
      rows.map(p => {
        const shown = p.entries;
        const revN = shown.filter(e => e.review).length;
        return '<tr class="row" data-k="' + p.key + '">' +
          '<td><span class="ttl">' + esc(p.title) + '</span></td>' +
          '<td data-label="플랫폼"><span class="tag">' + p.platform + ' ' + p.problemId + '</span></td>' +
          '<td data-label="회차">' + (p.weeks.join(', ') || '—') + '주차</td>' +
          '<td data-label="푼 사람"><div class="who">' + rowAuthors(p).map(a => {
            const es = shown.filter(e => e.author === a.id);
            const cls = 'av' + (es.length ? ' has' : '') + (es.some(e => e.review) ? ' rev' : '') + (KING && KING.id === a.id ? ' king' : '');
            return '<div class="' + cls + '" title="' + a.displayName + '">' + esc(initial(a.displayName)) + '</div>';
          }).join('') + '</div></td>' +
          '<td data-label="리뷰">' + (revN ? revN + ' / ' + shown.length : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>'
      : '<p class="empty">조건에 맞는 문제가 없습니다.</p>');

  app.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => { location.hash = '#/p/' + tr.dataset.k; });

  });

/* 같은 사람의 이전/실패 버전. 대표 코드 아래에 접어서 붙인다. */

let focusIdx = null; // 문제 상세: 크게 보기 상태. null 이면 그리드.
// 크게 보기의 코드/리뷰 폭 비율. 드래그로 조절하고 기기별로 기억한다(리뷰가 잘려 보이던 문제 대응).
// file:// 로 열면 브라우저에 따라 localStorage 가 막혀 있을 수 있어 항상 try/catch로 감싼다.
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let focusRevW = Number(store.get('focusRevW')) || 400;

/* ---------- 익명 댓글 (크게 보기 전용) ----------
   풀이 하나(문제 × 작성자)에 스레드 하나. 로그인 없음 — 닉네임을 비우면 "익명" 으로 남는다.
   저장소는 Supabase(Postgres). SDK 를 싣지 않고 REST 를 fetch 로 직접 부른다(외부 의존성 0 유지).
   아래 두 줄만 채우면 켜진다. anon key 는 브라우저에 노출되는 공개 키다 —
   service_role 키는 절대 넣지 말 것. 테이블·정책 SQL 은 docs/comments-supabase.sql 에 있다.
   비어 있거나 fetch 가 없는 환경(스모크 VM 등)에서는 안내만 띄우고 조용히 넘어간다. */
const CMT = {
  url: '',   // 예: 'https://abcdefgh.supabase.co'
  key: '',   // Supabase anon (publishable) key
  table: 'comments', limit: 200, maxBody: 1000, maxNick: 20,
};
const cmtOn = () => !!(CMT.url && CMT.key && typeof fetch === 'function');
const cmtKey = (p, e) => p.key + '#' + e.author + (e.variant ? '.' + e.variant : '');
const cmtBase = () => CMT.url.replace(/\/+$/, '') + '/rest/v1/' + CMT.table;
const cmtHeaders = () => ({ apikey: CMT.key, Authorization: 'Bearer ' + CMT.key, 'Content-Type': 'application/json' });

function cmtList(key) {
  const q = cmtBase() + '?select=id,nick,body,created_at&solution=eq.' + encodeURIComponent(key)
    + '&order=created_at.asc&limit=' + CMT.limit;
  return fetch(q, { headers: cmtHeaders() })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function cmtAdd(key, nick, body) {
  return fetch(cmtBase(), {
    method: 'POST',
    headers: Object.assign(cmtHeaders(), { Prefer: 'return=minimal' }),
    body: JSON.stringify({ solution: key, nick: nick || null, body }),
  }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); });
}
function cmtWhen(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const p2 = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate())
    + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

/* ---------- T4-3. 정석 코드 diff ----------
   줄 단위 LCS. 들여쓰기만 다른 줄은 같은 줄로 본다(trim 비교) — 스타일 차이로
   diff 가 새빨개지면 정작 알고리즘 차이가 안 보인다.
   풀이 파일은 길어야 200줄 남짓이라 O(n*m) DP 를 그냥 돌린다. */
function diffLines(mine, ref) {
  const a = mine.split('\n'), b = ref.split('\n');
  const n = a.length, m = b.length;
  const ka = a.map(s => s.trim()), kb = b.map(s => s.trim());
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = ka[i] === kb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (ka[i] === kb[j]) { out.push(['=', b[j]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', a[i++]]);
    else out.push(['+', b[j++]]);
  }
  while (i < n) out.push(['-', a[i++]]);
  while (j < m) out.push(['+', b[j++]]);
  return out;
}

/* 안 바뀐 줄이 6줄 넘게 이어지면 접는다. 앞뒤 2줄은 맥락으로 남긴다. */
function foldRuns(rows, ctx = 2, min = 6) {
  const out = [];
  let run = [];
  const flush = () => {
    if (!run.length) return;
    if (run.length <= min) out.push(...run);
    else { out.push(...run.slice(0, ctx)); out.push(['~', (run.length - ctx * 2) + '줄 동일']); out.push(...run.slice(-ctx)); }
    run = [];
  };
  for (const r of rows) { if (r[0] === '=') run.push(r); else { flush(); out.push(r); } }
  flush();
  return out;
}

function diffHtml(mine, ref) {
  const rows = foldRuns(diffLines(mine, ref));
  const changed = rows.filter(r => r[0] !== '=' && r[0] !== '~').length;
  const body = rows.map(([k, line]) => {
    if (k === '~') return '<span class="dfold">   ⋯ ' + esc(line) + ' ⋯</span>';
    const cls = k === '=' ? 'de' : k === '-' ? 'dm' : 'dp';
    return '<span class="' + cls + '">' + esc(k === '=' ? '  ' : k + ' ') + hl(line) + '</span>';
  }).join('');
  return '<div class="difflegend"><span class="m"><b>−</b> 내 코드에만</span>' +
    '<span class="p"><b>+</b> 정석 코드에만</span><span>' + changed + '줄 차이</span></div>' +
    '<pre class="code diff">' + body + '</pre>';
}

/* 코드 열마다 붙는 "정석 코드와 diff" 버튼.
   위쪽 refPanel 이 정석 코드 전문을 이미 보여주므로 여기서는 차이만 보여준다.

function viewProblem(key) {
  const p = D.problems.find(x => x.key === key);
  if (!p) { location.hash = '#/'; return; }
  const entries = p.entries;
  const n = entries.length;
  focusIdx = null;

  function colCard(e, i) {
    return '<div class="col' + (i === 0 && focusIdx === null ? ' on' : '') + '">' +
      '<h3>' + esc(e.authorName) + (e.variant ? ' <span class="tag">' + e.variant + '</span>' : '') +
        '<span class="sub">' + e.lines + '줄</span>' +
        '<button class="expand-btn" data-i="' + i + '">크게 보기</button>' +
      '</h3>' +
      '<pre class="code">' + hl(e.code) + '</pre>' +
      reviewBlock(e) +
      (e.alts || []).map(a => altBlock(a)).join('') +
      refDiffBlock(p, e) +
    '</div>';
  }

  function focusView(i) {
    const e = entries[i];
    return '<div class="tabs foc-tabs">' +
        entries.map((x, j) => '<button data-i="' + j + '"' + (j === i ? ' class="on"' : '') + '>' +
          esc(x.authorName) + (x.variant ? ' (' + x.variant + ')' : '') + '</button>').join('') +
        '<button class="expand-btn back" id="grid-back">그리드로 보기</button>' +
      '</div>' +
      '<div class="focus" id="focus-split" style="--rev-w:' + focusRevW + 'px">' +
        '<div class="col focus-code"><h3>' + esc(e.authorName) +
            (e.variant ? ' <span class="tag">' + e.variant + '</span>' : '') +
            '<span class="sub">' + e.lines + '줄</span></h3>' +
          '<pre class="code">' + hl(e.code) + '</pre>' +
          (e.alts || []).map(a => altBlock(a)).join('') +
        '</div>' +
        '<div class="focus-resizer" id="focus-resizer" title="드래그해서 폭 조절 · 더블클릭하면 기본 폭"></div>' +
        '<div class="col focus-review">' + reviewBlock(e) + '</div>' +
      '</div>' +
      cmtBlock(cmtKey(p, e));
  }

  // 크게 보기 리뷰 패널 폭 드래그. 오른쪽 가장자리에서 마우스까지 거리 = 리뷰 폭.
  function bindFocusResizer() {
    const resizer = document.getElementById('focus-resizer');
    const split = document.getElementById('focus-split');
    if (!resizer || !split) return;
    const apply = (clientX) => {
      const rect = split.getBoundingClientRect();
      const min = 240, max = rect.width * 0.82;
      const w = Math.max(min, Math.min(max, rect.right - clientX));
      focusRevW = Math.round(w);
      split.style.setProperty('--rev-w', focusRevW + 'px');
    };
    resizer.addEventListener('pointerdown', (ev) => {
      resizer.setPointerCapture(ev.pointerId);
      resizer.classList.add('active');
      ev.preventDefault();
    });
    resizer.addEventListener('pointermove', (ev) => {
      if (!resizer.hasPointerCapture(ev.pointerId)) return;
      apply(ev.clientX);
    });
    const stop = (ev) => {
      if (!resizer.classList.contains('active')) return;
      resizer.classList.remove('active');
      store.set('focusRevW', focusRevW);
    };
    resizer.addEventListener('pointerup', stop);
    resizer.addEventListener('pointercancel', stop);
    resizer.addEventListener('dblclick', () => {
      focusRevW = 400;
      split.style.setProperty('--rev-w', '400px');
      store.set('focusRevW', focusRevW);
    });
  }

  function render() {
    const refs = (p.references || []).slice(0, 2);
    app.innerHTML =
      '<a class="back" href="#/">← 문제 목록</a>' +
      '<div class="phead"><h2>' + esc(p.title) + '</h2>' +
      '<div class="meta">' +
        '<span class="tag">' + p.platform + ' ' + p.problemId + '</span>' +
        '<span>' + (p.weeks.join(', ') || '—') + '주차</span>' +
        '<span>' + n + '개 풀이</span>' +
        (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">문제 보기 ↗</a>' : '') +
      '</div></div>' +
      (refs.length
        ? '<details class="rev ref" open><summary><span class="t-open">📖 정석 코드 보기 (' + refs.length + ')</span>' +
            '<span class="t-close">📖 정석 코드 접기</span></summary>' +
          '<div class="rev-body">' + refPanel(p) + '</div></details>'
        : '<div class="norev ref">📖 정석 코드가 아직 없습니다 · <code>references/' + p.key + '/{id}.java</code> 로 추가하면 여기 표시됩니다</div>') +
      (p.teamFeedback
        ? '<details class="rev fb"><summary><span class="t-open">발표 후 팀 피드백 보기</span>' +
          '<span class="t-close">팀 피드백 접기</span></summary>' +
          '<div class="rev-body">' + md(p.teamFeedback) + '</div></details>'
        : '<div class="norev fb">팀 피드백 없음 · <code>reviews/' + p.key + '/team-feedback.md</code> 에 적으면 여기 표시됩니다</div>') +
      (focusIdx === null
        ? '<div class="tabs">' + entries.map((e, i) =>
            '<button data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(e.authorName) +
            (e.variant ? ' (' + e.variant + ')' : '') + '</button>').join('') + '</div>' +
          '<div class="cols ' + (n <= 2 ? 'n' + n : '') + ' tabbed">' + entries.map(colCard).join('') + '</div>'
        : focusView(focusIdx));

    bind();
  }

  function bind() {
    bindRefDiff(app);
    bindComments(app);
    const back = document.getElementById('grid-back');
    if (back) back.onclick = () => { focusIdx = null; render(); };

    app.querySelectorAll('.expand-btn[data-i]').forEach(b => b.onclick = () => {
      focusIdx = +b.dataset.i; render();
    });
    bindFocusResizer();
    app.querySelectorAll('.foc-tabs button[data-i]').forEach(b => b.onclick = () => {
      focusIdx = +b.dataset.i; render();
    });
    if (focusIdx === null) {
      app.querySelectorAll('.tabs:not(.foc-tabs) button').forEach(b => b.onclick = () => {
        app.querySelectorAll('.tabs:not(.foc-tabs) button').forEach(x => x.classList.remove('on'));
        app.querySelectorAll('.col').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        app.querySelectorAll('.col')[+b.dataset.i].classList.add('on');
      });
    }
  }

  render();
}

function viewPeople() {

      '</h3><div class="id">' + x.a.id + '</div>' +

        '<div class="stat"><b>' + x.solved + '</b><span>문제</span></div>' +

        '<div class="stat"><b>' + x.revs.length + '</b><span>리뷰</span></div>' +
      '</div>' +

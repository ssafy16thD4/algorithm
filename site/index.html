<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSAFY 16기 대전 4반 — 알고리즘 스터디</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --line: #e2e1dd; --line-soft: #efeeea;
  --fg: #1b1a18; --muted: #6f6c66; --accent: #b4532a; --accent-soft: #f6ece7;
  --ok: #2f7d4f; --warn: #b07a12; --bad: #b23b3b;
  --code-bg: #fbfaf8; --kw: #8a4b9c; --str: #2f7d4f; --com: #9a9790; --num: #b4532a;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "D2Coding", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a; --panel: #1d1d22; --line: #32323a; --line-soft: #26262c;
    --fg: #e8e6e1; --muted: #9b978f; --accent: #e08a5f; --accent-soft: #2c221d;
    --ok: #6fbf8b; --warn: #d9ad57; --bad: #e2726f;
    --code-bg: #17171b; --kw: #c891dd; --str: #8fd0a5; --com: #6c6a66; --num: #e0a06a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 80px; }

header { border-bottom: 1px solid var(--line); background: var(--panel); margin-bottom: 26px; }
.head-in { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline; }
h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
nav { margin-left: auto; display: flex; gap: 4px; }
nav a { padding: 6px 14px; border-radius: 7px; text-decoration: none; color: var(--muted); font-size: 14px; }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
input, select { font: inherit; font-size: 14px; padding: 7px 11px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--panel); color: var(--fg); }
input[type=search] { min-width: 210px; }
label.chk { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
.count { margin-left: auto; color: var(--muted); font-size: 13px; }
label.chk.alum { font-size: 13px; white-space: nowrap; }

table { width: 100%; border-collapse: collapse; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--accent-soft); }
.ttl { font-weight: 600; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11.5px;
  border: 1px solid var(--line); color: var(--muted); background: var(--bg); white-space: nowrap; }

.who { display: flex; gap: 4px; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
.av.has { background: var(--accent); border-color: var(--accent); color: #fff; }
.av.rev { box-shadow: 0 0 0 2px var(--ok); }

.back { display: inline-block; margin-bottom: 14px; font-size: 14px; text-decoration: none; }
.phead { margin-bottom: 18px; }
.phead h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
.phead .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 12px; flex-wrap: wrap; }

.tabs { display: none; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

.cols { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.cols.n1 { grid-template-columns: minmax(0, 760px); }
.cols.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.col > h3 { margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--line);
  font-size: 14px; display: flex; align-items: center; gap: 8px; }
.col > h3 .sub { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
pre.code { margin: 0; padding: 14px; overflow-x: auto; background: var(--code-bg);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6; tab-size: 4; }
pre.code .k { color: var(--kw); } pre.code .s { color: var(--str); }
pre.code .c { color: var(--com); font-style: italic; } pre.code .n { color: var(--num); }

.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700; border: 1px solid transparent; }
.b-good { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.b-needs-fix { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.b-wrong, .b-nc { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.b-unattempted { background: var(--bg); color: var(--muted); border-color: var(--line); }

details.rev { border-top: 1px solid var(--line); padding: 12px 14px; }
details.rev > summary { cursor: pointer; font-size: 13px; font-weight: 700;
  color: var(--accent); background: var(--accent-soft); list-style: none;
  display: inline-flex; gap: 7px; align-items: center; user-select: none;
  padding: 7px 14px; border: 1px solid var(--accent); border-radius: 7px; }
details.rev > summary:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
details.rev > summary::-webkit-details-marker { display: none; }
details.rev > summary::before { content: "▸"; font-size: 11px; }
details.rev[open] > summary::before { content: "▾"; }
details.rev > summary .t-close, details.rev[open] > summary .t-open { display: none; }
details.rev[open] > summary .t-close { display: inline; }
.rev-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 4px; }
details.rev.alt > summary { color: var(--muted); border-color: var(--line); background: var(--bg); }
details.rev.alt > summary:hover { background: var(--panel); }
details.rev.alt .rev-meta:first-child { margin-top: 4px; }
.rev-body { padding: 4px 2px 6px; font-size: 14px; }
.rev-body h1 { display: none; }
.rev-body h2 { font-size: 15px; margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line-soft); }
.rev-body h3 { font-size: 14px; margin: 16px 0 6px; }
.rev-body pre.code { border: 1px solid var(--line); border-radius: 7px; margin: 10px 0; font-size: 12px; }
.rev-body code { background: var(--code-bg); border: 1px solid var(--line-soft);
  padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
.rev-body pre.code code { background: none; border: 0; padding: 0; }
.rev-body ul { padding-left: 20px; } .rev-body li { margin: 4px 0; }
details.rev.fb, .norev.fb { background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.norev.fb { border-top: 0; }
/* ---------- T4-3. 정석코드 비교 ---------- */
details.rev.ref > summary { color: var(--accent); border-color: var(--accent);
  background: var(--accent-soft); }
.reftabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
.reftabs button, .refmode button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.reftabs button.on, .refmode button.on { background: var(--accent); border-color: var(--accent);
  color: #fff; font-weight: 600; }
.refmode { display: flex; gap: 4px; margin: 10px 0 6px; }
.refpane { display: none; } .refpane.on { display: block; }
.refview { display: none; } .refview.on { display: block; }
.refmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; margin: 6px 0; }
.refmeta a { font-size: 12px; }
.lic { color: var(--warn); font-size: 11.5px; }
.refnote { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
pre.code.diff span { display: block; padding: 0 4px; margin: 0 -14px; padding-left: 18px; text-indent: -14px; }
pre.code.diff .dm { background: color-mix(in srgb, var(--bad) 14%, transparent); }
pre.code.diff .dp { background: color-mix(in srgb, var(--ok) 14%, transparent); }
pre.code.diff .dfold { color: var(--muted); font-style: italic; background: var(--line-soft); }
.difflegend { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); margin: 0 0 6px; }
.difflegend b { font-weight: 700; }
.difflegend .m { color: var(--bad); } .difflegend .p { color: var(--ok); }
.norev { padding: 12px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.norev code { font-family: var(--mono); font-size: 12px; background: var(--code-bg);
  padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line-soft); }

.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card h3 { margin: 0 0 4px; font-size: 17px; }
.card .id { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
.stats { display: flex; gap: 20px; margin: 14px 0; }
.stat b { display: block; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--muted); }
.card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 16px 0 8px; font-weight: 600; }
.trow { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
.trow .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .bar-bg { width: 70px; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.trow .bar-fg { height: 100%; background: var(--accent); }
.trow .num { width: 18px; text-align: right; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

.note { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 22px; font-size: 13.5px; color: var(--muted); }
.note b { color: var(--fg); }

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) !important; }
  .cols.tabbed > .col { display: none; }
  .cols.tabbed > .col.on { display: block; }
  .tabs { display: flex; }
}
</style>
</head>
<body>
<header><div class="head-in">
  <h1>알고리즘 스터디 <span id="sub"></span></h1>
  <nav><a href="#/" id="nav-p">문제</a><a href="#/people" id="nav-w">사람별</a><a href="#/rotation" id="nav-r">로테이션</a></nav>
  <label class="chk alum"><input type="checkbox" id="f-alum"> 졸업생 포함</label>
</div></header>
<div class="wrap" id="app"></div>

<script src="data/bundle.js"></script>
<script>
const D = window.STUDY_DATA;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = n => n.length > 1 ? n.slice(1, 3) : n;
const authorName = id => (D.authors.find(a => a.id === id) || {}).displayName || id;
const isActive = id => ((D.authors.find(a => a.id === id) || {}).active !== false);

// 스터디를 떠난 사람의 코드는 지우지 않고 기본 화면에서만 감춘다. 체크하면 다시 보인다.
let showAlumni = false;
const shownAuthors = () => D.authors.filter(a => a.active !== false || showAlumni);
const shownEntries = p => p.entries.filter(e => isActive(e.author) || showAlumni);
const activeCount = () => D.authors.filter(a => a.active !== false).length;
const tagLabel = id => (D.tags.find(t => t.id === id) || {}).label || id;

document.getElementById('sub').textContent =
  D.problems.length + '문제 · ' + D.problems.reduce((a, p) => a + p.entries.length, 0) + '풀이 · ' + D.generatedAt + ' 기준';

/* ---------- Java 하이라이터 ---------- */
const KW = 'abstract|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|package|private|protected|public|return|short|static|super|switch|this|throw|throws|try|void|while|var|record|true|false|null';
const TOKEN = new RegExp('(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|\\b(\\d[\\d_]*(?:\\.\\d+)?[fdlL]?)\\b|\\b(' + KW + ')\\b', 'g');
function hl(src) {
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += '<span class="' + (m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : 'k') + '">' + esc(m[0]) + '</span>';
    last = TOKEN.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* ---------- 리뷰 마크다운 (쓰는 문법만) ---------- */
function md(src) {
  const fences = [];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    code = code.replace(/\n$/, '');
    fences.push('<pre class="code">' + (lang === 'java' || !lang ? hl(code) : esc(code)) + '</pre>');
    return '' + (fences.length - 1) + '';
  });
  const inl = s => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  const out = [];
  let list = false;
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const line of src.split('\n')) {
    const t = line.trim();
    if (!t) { closeList(); continue; }
    if (/^\d+$/.test(t)) { closeList(); out.push(t); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length; out.push('<h' + n + '>' + inl(h[2]) + '</h' + n + '>'); continue; }
    const li = t.match(/^[-*]\s+(.*)$/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inl(li[1]) + '</li>'); continue; }
    closeList();
    out.push('<p>' + inl(t) + '</p>');
  }
  closeList();
  return out.join('\n').replace(/(\d+)/g, (_, i) => fences[+i]);
}

/* ---------- 문제 목록 ---------- */
let filt = { platform: '', week: '', q: '', full: false, reviewed: false, ref: false };

function viewList() {
  const weeks = [...new Set(D.problems.flatMap(p => p.weeks))].sort((a, b) => a - b);
  const refN = D.problems.filter(p => (p.references || []).length).length;
  const rows = D.problems.filter(p => {
    if (filt.platform && p.platform !== filt.platform) return false;
    if (filt.week && !p.weeks.includes(+filt.week)) return false;
    if (filt.full && new Set(shownEntries(p).map(e => e.author)).size < shownAuthors().length) return false;
    if (filt.reviewed && !shownEntries(p).some(e => e.review)) return false;
    if (filt.ref && !(p.references || []).length) return false;
    if (filt.q && !(p.title + ' ' + p.problemId).toLowerCase().includes(filt.q.toLowerCase())) return false;
    return true;
  });

  app.innerHTML =
    '<div class="note">같은 문제를 푼 사람들의 코드를 <b>나란히 놓고 비교</b>하려고 만들었습니다. ' +
    '문제를 클릭하면 열립니다. 아바타에 <b>초록 테두리</b>가 있으면 리뷰까지 붙어 있는 코드입니다.</div>' +
    '<div class="bar">' +
      '<select id="f-pf"><option value="">전체 플랫폼</option>' +
        ['programmers', 'swea'].map(v => '<option value="' + v + '"' + (filt.platform === v ? ' selected' : '') + '>' + v + '</option>').join('') +
      '</select>' +
      '<select id="f-wk"><option value="">전체 회차</option>' +
        weeks.map(w => '<option value="' + w + '"' + (filt.week == w ? ' selected' : '') + '>' + w + '주차</option>').join('') +
      '</select>' +
      '<input type="search" id="f-q" placeholder="문제 제목 / 번호 검색" value="' + esc(filt.q) + '">' +
      '<label class="chk"><input type="checkbox" id="f-full"' + (filt.full ? ' checked' : '') + '> ' + shownAuthors().length + '명 다 푼 문제만</label>' +
      '<label class="chk"><input type="checkbox" id="f-rev"' + (filt.reviewed ? ' checked' : '') + '> 리뷰 있는 문제만</label>' +
      '<label class="chk"><input type="checkbox" id="f-ref"' + (filt.ref ? ' checked' : '') + '> 정석코드 있는 문제만 (' + refN + ')</label>' +
      '<span class="count">' + rows.length + ' / ' + D.problems.length + '문제</span>' +
    '</div>' +
    (rows.length ? '<table><thead><tr><th>문제</th><th>플랫폼</th><th>회차</th><th>푼 사람</th><th>리뷰</th><th>정석코드</th></tr></thead><tbody>' +
      rows.map(p => {
        const shown = shownEntries(p);
        const revN = shown.filter(e => e.review).length;
        return '<tr class="row" data-k="' + p.key + '">' +
          '<td><span class="ttl">' + esc(p.title) + '</span></td>' +
          '<td><span class="tag">' + p.platform + ' ' + p.problemId + '</span></td>' +
          '<td>' + (p.weeks.join(', ') || '—') + '주차</td>' +
          '<td><div class="who">' + shownAuthors().map(a => {
            const es = shown.filter(e => e.author === a.id);
            const cls = 'av' + (es.length ? ' has' : '') + (es.some(e => e.review) ? ' rev' : '');
            return '<div class="' + cls + '" title="' + a.displayName + '">' + esc(initial(a.displayName)) + '</div>';
          }).join('') + '</div></td>' +
          '<td>' + (revN ? revN + ' / ' + shown.length : '<span style="color:var(--muted)">—</span>') + '</td>' +
          '<td>' + ((p.references || []).length
            ? '<span class="tag">' + p.references.length + '개</span>'
            : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>'
      : '<p class="empty">조건에 맞는 문제가 없습니다.</p>');

  app.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => { location.hash = '#/p/' + tr.dataset.k; });
  const bind = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  bind('f-pf', 'change', e => { filt.platform = e.target.value; viewList(); });
  bind('f-wk', 'change', e => { filt.week = e.target.value; viewList(); });
  bind('f-full', 'change', e => { filt.full = e.target.checked; viewList(); });
  bind('f-rev', 'change', e => { filt.reviewed = e.target.checked; viewList(); });
  bind('f-ref', 'change', e => { filt.ref = e.target.checked; viewList(); });
  bind('f-q', 'input', e => {
    filt.q = e.target.value; viewList();
    const el = document.getElementById('f-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  });
}


/* ---------- T4-3. 정석코드 diff ----------
   줄 단위 LCS. 들여쓰기만 다른 줄은 같은 줄로 본다(trim 비교) — 스타일 차이로
   diff 가 새빨개지면 정작 알고리즘 차이가 안 보인다.
   풀이 파일은 길어야 200줄 남짓이라 O(n*m) DP 를 그냥 돌린다. */
function diffLines(mine, ref) {
  const a = mine.split('\n'), b = ref.split('\n');
  const n = a.length, m = b.length;
  const ka = a.map(s => s.trim()), kb = b.map(s => s.trim());
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = ka[i] === kb[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (ka[i] === kb[j]) { out.push(['=', b[j]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['-', a[i++]]); }
    else { out.push(['+', b[j++]]); }
  }
  while (i < n) out.push(['-', a[i++]]);
  while (j < m) out.push(['+', b[j++]]);
  return out;
}

/* 안 바뀐 줄이 6줄 넘게 이어지면 접는다. 앞뒤 2줄은 맥락으로 남긴다. */
function foldRuns(rows, ctx = 2, min = 6) {
  const out = [];
  let run = [];
  const flush = () => {
    if (!run.length) return;
    if (run.length <= min) out.push(...run);
    else {
      out.push(...run.slice(0, ctx));
      out.push(['~', (run.length - ctx * 2) + '줄 동일']);
      out.push(...run.slice(-ctx));
    }
    run = [];
  };
  for (const r of rows) {
    if (r[0] === '=') run.push(r);
    else { flush(); out.push(r); }
  }
  flush();
  return out;
}

function diffHtml(mine, ref) {
  const rows = foldRuns(diffLines(mine, ref));
  const changed = rows.filter(r => r[0] === '-' || r[0] === '+').length;
  const body = rows.map(([k, line]) => {
    if (k === '~') return '<span class="dfold">   ⋯ ' + esc(line) + ' ⋯</span>';
    const cls = k === '=' ? 'de' : k === '-' ? 'dm' : 'dp';
    const mark = k === '=' ? '  ' : k + ' ';
    return '<span class="' + cls + '">' + esc(mark) + hl(line) + '</span>';
  }).join('');
  return '<div class="difflegend"><span class="m"><b>−</b> 내 코드에만</span>' +
    '<span class="p"><b>+</b> 정석코드에만</span>' +
    '<span>' + changed + '줄 차이</span></div>' +
    '<pre class="code diff">' + body + '</pre>';
}

/* 코드 열 하나에 붙는 "정석코드" 버튼. p.references 가 비면 아무것도 안 붙는다. */
function refBlock(p, e) {
  const refs = p.references || [];
  if (!refs.length) return '';
  return '<details class="rev ref"><summary><span class="t-open">정석코드 비교</span>' +
      '<span class="t-close">정석코드 접기</span></summary>' +
    '<div class="rev-body">' +
      (refs.length > 1
        ? '<div class="reftabs">' + refs.map((r, k) =>
            '<button data-rk="' + k + '"' + (k === 0 ? ' class="on"' : '') + '>' +
            esc(r.label) + '</button>').join('') + '</div>'
        : '') +
      refs.map((r, k) =>
        '<div class="refpane' + (k === 0 ? ' on' : '') + '">' +
          '<div class="refmeta">' +
            '<span class="tag">' + esc(r.providerName) + '</span>' +
            (refs.length === 1 ? '<span class="tag">' + esc(r.label) + '</span>' : '') +
            '<a href="' + esc(r.sourceUrl) + '" target="_blank" rel="noopener">원본 보기 ↗</a>' +
            (r.license ? '<span class="tag">' + esc(r.license) + '</span>'
                       : '<span class="lic">라이선스 표기 없음 · 출처 링크 유지 필수</span>') +
          '</div>' +
          '<div class="refmode">' +
            '<button class="on" data-rm="diff">내 코드와 diff</button>' +
            '<button data-rm="full">정석코드 전문</button></div>' +
          '<div class="refview m-diff on">' + diffHtml(e.code, r.code) + '</div>' +
          '<div class="refview m-full"><pre class="code">' + hl(r.code) + '</pre></div>' +
          (r.notes
            ? '<details class="rev notes"><summary><span class="t-open">' + esc(r.providerName) +
              ' 의 풀이 설명 보기</span><span class="t-close">풀이 설명 접기</span></summary>' +
              '<div class="rev-body">' + md(r.notes) + '</div></details>'
            : '<p class="refnote">이 레퍼런스에는 풀이 설명이 없습니다.</p>') +
        '</div>').join('') +
    '</div></details>';
}

/* 정석코드 블록 안의 탭·모드 버튼. 열마다 독립적으로 동작해야 하므로 블록 단위로 건다. */
function bindRefBlocks(root) {
  root.querySelectorAll('details.rev.ref').forEach(box => {
    box.querySelectorAll(':scope > .rev-body > .reftabs button').forEach(b => b.onclick = () => {
      box.querySelectorAll(':scope > .rev-body > .reftabs button').forEach(x => x.classList.remove('on'));
      box.querySelectorAll(':scope > .rev-body > .refpane').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      box.querySelectorAll(':scope > .rev-body > .refpane')[+b.dataset.rk].classList.add('on');
    });
    box.querySelectorAll('.refpane').forEach(pane => {
      pane.querySelectorAll('.refmode button').forEach(b => b.onclick = () => {
        pane.querySelectorAll('.refmode button').forEach(x => x.classList.remove('on'));
        pane.querySelectorAll('.refview').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        pane.querySelector('.refview.m-' + b.dataset.rm).classList.add('on');
      });
    });
  });
}

/* ---------- 문제 상세 (3열 비교) ---------- */
/* 같은 사람의 이전/실패 버전. 대표 코드 아래에 접어서 붙인다. */
function altBlock(a) {
  const label = a.variant === 'failed' ? '실패 코드' : a.variant === 'alt' ? '대안 코드' : '이전 코드';
  const r = a.review;
  const file = a.source.split('/').pop();
  return '<details class="rev alt"><summary><span class="t-open">' + label + ' 보기</span>' +
      '<span class="t-close">' + label + ' 접기</span></summary>' +
    '<div class="rev-body">' +
      '<div class="rev-meta"><span class="tag">' + esc(file) + '</span>' +
        '<span class="tag">' + a.lines + '줄</span>' +
        (a.committedAt ? '<span class="tag">' + esc(a.committedAt) + '</span>' : '') +
      '</div>' +
      '<pre class="code">' + hl(a.code) + '</pre>' +
      (r
        ? '<div class="rev-meta">' +
            (r.verdict ? '<span class="badge b-' + r.verdict + '">' + r.verdict + '</span>' : '') +
            (r.compiles === 'false' ? '<span class="badge b-nc">compile ✗</span>' : '') +
            (r.tags || []).map(t => '<span class="tag">' + esc(tagLabel(t)) + '</span>').join('') +
          '</div>' + md(r.body)
        : '<div class="norev">리뷰 없음 · <code>/review ' + esc(a.source) + '</code></div>') +
    '</div></details>';
}

function viewProblem(key) {
  const p = D.problems.find(x => x.key === key);
  if (!p) { location.hash = '#/'; return; }
  const entries = shownEntries(p);
  const n = entries.length;
  const hidden = p.entries.length - n;

  app.innerHTML =
    '<a class="back" href="#/">← 문제 목록</a>' +
    '<div class="phead"><h2>' + esc(p.title) + '</h2><div class="meta">' +
      '<span class="tag">' + p.platform + ' ' + p.problemId + '</span>' +
      '<span>' + (p.weeks.join(', ') || '—') + '주차</span>' +
      '<span>' + n + '개 풀이' + (hidden ? ' (졸업생 ' + hidden + '개 숨김)' : '') + '</span>' +
      (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">문제 보기 ↗</a>' : '') +
      ((p.references || []).length
        ? '<span class="tag">정석코드 ' + p.references.length + '개</span>' : '') +
    '</div></div>' +
    (p.teamFeedback
      ? '<details class="rev fb"><summary><span class="t-open">발표 후 팀 피드백 보기</span>' +
        '<span class="t-close">팀 피드백 접기</span></summary>' +
        '<div class="rev-body">' + md(p.teamFeedback) + '</div></details>'
      : '<div class="norev fb">팀 피드백 없음 · <code>reviews/' + p.key + '/team-feedback.md</code> 에 적으면 여기 표시됩니다</div>') +
    '<div class="tabs">' + entries.map((e, i) =>
      '<button data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(e.authorName) +
      (e.variant ? ' (' + e.variant + ')' : '') + '</button>').join('') + '</div>' +
    '<div class="cols ' + (n <= 2 ? 'n' + n : '') + ' tabbed">' + entries.map((e, i) => {
      const r = e.review;
      const verdict = r ? r.verdict : null;
      return '<div class="col' + (i === 0 ? ' on' : '') + '">' +
        '<h3>' + esc(e.authorName) + (e.variant ? ' <span class="tag">' + e.variant + '</span>' : '') +
          '<span class="sub">' + e.lines + '줄</span></h3>' +
        '<pre class="code">' + hl(e.code) + '</pre>' +
        (r
          ? '<details class="rev"><summary><span class="t-open">리뷰 보기</span>' +
              '<span class="t-close">리뷰 접기</span></summary>' +
            '<div class="rev-body"><div class="rev-meta">' +
              (verdict ? '<span class="badge b-' + verdict + '">' + verdict + '</span>' : '') +
              (r.compiles === 'false' ? '<span class="badge b-nc">compile ✗</span>' : '') +
              (r.tags || []).map(t => '<span class="tag">' + esc(tagLabel(t)) + '</span>').join('') +
            '</div>' + md(r.body) + '</div></details>'
          : '<div class="norev">리뷰 없음 · <code>/review ' + esc(e.source) + '</code></div>') +
        (e.alts || []).map(a => altBlock(a)).join('') +
        refBlock(p, e) +
      '</div>';
    }).join('') + '</div>';

  bindRefBlocks(app);

  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    app.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
    app.querySelectorAll('.col').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    app.querySelectorAll('.col')[+b.dataset.i].classList.add('on');
  });
}

/* ---------- 사람별 ---------- */
function viewPeople() {
  const per = shownAuthors().map(a => {
    const es = D.problems.flatMap(p => p.entries.filter(e => e.author === a.id).map(e => ({ e, p })));
    const revs = es.filter(x => x.e.review).map(x => x.e.review);
    const tags = {};
    revs.forEach(r => (r.tags || []).forEach(t => {
      if (!(D.tags.find(d => d.id === t) || {}).group || (D.tags.find(d => d.id === t) || {}).group !== 'praise')
        tags[t] = (tags[t] || 0) + 1;
    }));
    const top = Object.entries(tags).sort((x, y) => y[1] - x[1]).slice(0, 5);
    return { a, solved: new Set(es.map(x => x.p.key)).size, total: es.length, revs, top };
  });
  const maxTag = Math.max(1, ...per.flatMap(x => x.top.map(t => t[1])));

  app.innerHTML =
    '<div class="note"><b>반복 지적된 패턴 Top 5</b>는 리뷰의 고정 태그를 세서 만듭니다. ' +
    '리뷰가 쌓일수록 정확해집니다. (현재 ' + per.reduce((s, x) => s + x.revs.length, 0) + '건)</div>' +
    '<div class="cards">' + per.map(x =>
      '<div class="card"><h3>' + esc(x.a.displayName) +
      (x.a.active === false ? ' <span class="tag">졸업</span>' : '') +
      '</h3><div class="id">' + x.a.id + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><b>' + x.solved + '</b><span>문제</span></div>' +
        '<div class="stat"><b>' + x.total + '</b><span>풀이</span></div>' +
        '<div class="stat"><b>' + x.revs.length + '</b><span>리뷰</span></div>' +
      '</div>' +
      '<h4>반복 지적 패턴 Top 5</h4>' +
      (x.top.length
        ? x.top.map(([t, c]) =>
            '<div class="trow"><span class="lbl" title="' + t + '">' + esc(tagLabel(t)) + '</span>' +
            '<span class="bar-bg"><span class="bar-fg" style="width:' + (c / maxTag * 100) + '%"></span></span>' +
            '<span class="num">' + c + '</span></div>').join('')
        : '<div class="empty">리뷰가 쌓이면 표시됩니다.</div>') +
      '</div>').join('') + '</div>';
}


/* ---------- 로테이션 보드 ---------- */
function viewRotation() {
  const R = D.rotation || { order: [], assignments: [] };
  const asg = R.assignments || [];
  const done = asg.filter(a => a.status === 'done');
  const upcoming = asg.filter(a => a.status === 'upcoming')
    .sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')));
  const titleOf = k => { const p = D.problems.find(x => x.key === k); return p ? p.title : k; };

  // 한 바퀴 = order 길이만큼 발표가 끝난 묶음. 마지막으로 완성된 바퀴가 복습 대상이다.
  const n = Math.max(1, R.order.length);
  const cycles = [];
  for (let i = 0; i + n <= done.length; i += n) cycles.push(done.slice(i, i + n));
  const lastCycle = cycles.length ? cycles[cycles.length - 1] : null;

  // 미제출 — assignments 없이도 계산된다 (풀이 파일 존재 여부)
  // 떠난 사람은 앞으로 제출할 일이 없으므로 미제출 현황에서 제외한다 (졸업생 토글과 무관)
  const missing = D.authors.filter(a => a.active !== false).map(a => ({
    a, list: D.problems.filter(p => !p.entries.some(e => e.author === a.id)),
  }));

  const assigned = new Set(asg.map(a => a.problem));
  const unassigned = D.problems.filter(p => !assigned.has(p.key));

  app.innerHTML =
    (asg.length === 0
      ? '<div class="note"><b>발표 담당 데이터가 아직 없습니다.</b> 누가 무엇을 발표했는지는 커밋 기록으로 알 수 없어서 ' +
        '<code>data/rotation.json</code> 의 <code>assignments</code> 에 팀이 직접 채워야 합니다. ' +
        '기억나는 것부터 한 줄씩 넣으면 됩니다 — 파일 맨 위에 형식이 적혀 있습니다.<br>' +
        '아래 <b>미제출 현황</b>은 데이터 없이도 풀이 파일만 보고 계산하므로 지금 바로 쓸 수 있습니다.</div>'
      : '') +

    '<h2 style="font-size:17px;margin:0 0 10px">다음 발표</h2>' +
    (upcoming.length
      ? '<table><thead><tr><th>발표일</th><th>담당</th><th>문제</th></tr></thead><tbody>' +
        upcoming.slice(0, 5).map(a =>
          '<tr><td>' + esc(a.date || '미정') + '</td><td>' + esc(authorName(a.presenter)) + '</td>' +
          '<td><a href="#/p/' + a.problem + '">' + esc(titleOf(a.problem)) + '</a></td></tr>').join('') +
        '</tbody></table>'
      : '<p class="empty">예정된 발표가 없습니다.</p>') +

    '<h2 style="font-size:17px;margin:26px 0 10px">복습 큐' +
      (lastCycle ? ' <span class="tag">' + cycles.length + '바퀴 완료</span>' : '') + '</h2>' +
    (lastCycle
      ? '<div class="note">한 바퀴가 끝났습니다. 그때 발표했던 <b>본인 코드</b>를 다시 열어볼 차례입니다.</div>' +
        '<table><thead><tr><th>발표자</th><th>문제</th><th>그때 내 코드</th></tr></thead><tbody>' +
        lastCycle.map(a => {
          const pr = D.problems.find(x => x.key === a.problem);
          const mine = pr && pr.entries.find(e => e.author === a.presenter);
          return '<tr><td>' + esc(authorName(a.presenter)) + '</td>' +
            '<td>' + esc(titleOf(a.problem)) + '</td>' +
            '<td>' + (mine ? '<a href="#/p/' + a.problem + '">' + esc(mine.source) + '</a>'
                           : '<span style="color:var(--muted)">풀이 없음</span>') + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '<p class="empty">한 바퀴(' + n + '명)가 완료되면 여기에 복습 목록이 뜹니다.</p>') +

    '<h2 style="font-size:17px;margin:26px 0 10px">미제출 현황</h2>' +
    '<div class="cards">' + missing.map(m =>
      '<div class="card"><h3>' + esc(m.a.displayName) + '</h3>' +
      '<div class="stats"><div class="stat"><b>' + (D.problems.length - m.list.length) + '</b><span>제출</span></div>' +
      '<div class="stat"><b>' + m.list.length + '</b><span>미제출</span></div></div>' +
      (m.list.length
        ? '<h4>안 낸 문제</h4>' + m.list.map(p =>
            '<div class="trow"><a class="lbl" href="#/p/' + p.key + '">' + esc(p.title) + '</a>' +
            '<span class="tag">' + p.platform + '</span></div>').join('')
        : '<div class="empty">전부 제출했습니다.</div>') +
      '</div>').join('') + '</div>' +

    '<h2 style="font-size:17px;margin:26px 0 10px">담당자 미지정 ' +
      '<span class="tag">' + unassigned.length + ' / ' + D.problems.length + '</span></h2>' +
    (unassigned.length
      ? '<p class="empty">' + unassigned.map(p =>
          '<a href="#/p/' + p.key + '">' + esc(p.title) + '</a>').join(' · ') + '</p>'
      : '<p class="empty">모든 문제에 담당자가 있습니다.</p>');
}

/* ---------- 라우팅 ---------- */
function route() {
  const h = location.hash || '#/';
  const mode = h.startsWith('#/people') ? 'w' : h.startsWith('#/rotation') ? 'r' : 'p';
  for (const k of ['p', 'w', 'r']) document.getElementById('nav-' + k).className = k === mode ? 'on' : '';
  window.scrollTo(0, 0);
  if (h.startsWith('#/p/')) viewProblem(h.slice(4));
  else if (h.startsWith('#/people')) viewPeople();
  else if (h.startsWith('#/rotation')) viewRotation();
  else viewList();
}
addEventListener('hashchange', route);

const alumBox = document.getElementById('f-alum');
if (alumBox) alumBox.addEventListener('change', e => { showAlumni = e.target.checked; route(); });

route();
